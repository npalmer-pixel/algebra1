<style>
/* Layout: graph-paper ground, one centered reading column; breadcrumb > big title > content blocks; day pages end with prev/next. */
:root {
  --paper: #f7f9fc;
  --grid: #e3e9f3;
  --surface: #ffffff;
  --ink: #16213a;
  --muted: #5a6680;
  --line: #d5ddea;
  --accent: #2547c9;
  --accent-soft: #e6ecfd;
  --marker: #ffd84d;
  --marker-ink: #3b2f00;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1524; --grid: #18213a; --surface: #161e33; --ink: #e7ecf7; --muted: #9aa6c2;
    --line: #2a3654; --accent: #8ea6ff; --accent-soft: #1f2b52; --marker: #e8c33a; --marker-ink: #2a2100;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1524; --grid: #18213a; --surface: #161e33; --ink: #e7ecf7; --muted: #9aa6c2;
  --line: #2a3654; --accent: #8ea6ff; --accent-soft: #1f2b52; --marker: #e8c33a; --marker-ink: #2a2100;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.55;
}
.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.5rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.375rem; font-weight: 700; }
p { margin: 0; }

.site-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: .5rem; }
.brand-mark { font-family: var(--font-mono); font-size: .8rem; background: var(--ink); color: var(--paper); padding: .15rem .45rem; border-radius: 4px; }
.crumbs { font-size: .9rem; color: var(--muted); display: flex; gap: .4rem; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

.eyebrow { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.hero { display: flex; flex-direction: column; gap: .6rem; }
.lede { color: var(--muted); max-width: 60ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
.label { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.objective { font-family: var(--font-display); font-size: 1.375rem; font-weight: 700; line-height: 1.25; }
.vocab { display: flex; flex-wrap: wrap; gap: .4rem; }
.vocab span { font-family: var(--font-mono); font-size: .85rem; background: var(--accent-soft); color: var(--ink); padding: .2rem .55rem; border-radius: 4px; }

.resources { display: grid; gap: .6rem; }
.res {
  display: grid; grid-template-columns: 7.5rem 1fr auto; gap: .75rem; align-items: center;
  padding: .85rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--ink); text-decoration: none;
}
.res .kind { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.res .name { min-width: 0; }
.res .go { font-size: .85rem; color: var(--muted); white-space: nowrap; }
a.res:hover { border-color: var(--accent); }
a.res:hover .go { color: var(--accent); }
.res.pending { opacity: .75; }
@media (max-width: 520px) {
  .res { grid-template-columns: 1fr auto; }
  .res .kind { grid-column: 1 / -1; }
}

.event { background: var(--marker); color: var(--marker-ink); border-radius: 10px; padding: 1.25rem; display: flex; flex-direction: column; gap: .4rem; }
.event h2 { color: var(--marker-ink); }

.week { display: flex; flex-direction: column; gap: .6rem; }
.days { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.days li + li { border-top: 1px solid var(--line); }
.days a { display: grid; grid-template-columns: 4.25rem 1fr auto; gap: .75rem; align-items: center; padding: .8rem 1rem; color: var(--ink); text-decoration: none; }
.days a:hover { background: var(--accent-soft); }
.days .num { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); }
.days .topic { min-width: 0; }
.chip { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 4px; background: var(--marker); color: var(--marker-ink); }

.units { display: grid; gap: .75rem; }
.unit-card { display: flex; flex-direction: column; gap: .35rem; padding: 1.25rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-decoration: none; }
.unit-card:hover { border-color: var(--accent); }
.unit-card .meta { font-size: .9rem; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.pager a, .pager span { display: flex; flex-direction: column; gap: .15rem; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-decoration: none; min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager .next { text-align: right; }
.pager small { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager span { visibility: hidden; }

.units { grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.unit-card { flex-direction: row; align-items: center; gap: 1rem; }
.unit-card .badge { flex: none; width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.unit-card .text { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.unit-card h2 { font-size: 1.125rem; }
.chip.ext { background: var(--accent-soft); color: var(--accent); }
.covers { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
.covers a { color: var(--marker-ink); font-weight: 700; }
.covers span { font-family: var(--font-mono); font-size: .8rem; margin-right: .5rem; }
.note { font-size: .95rem; color: var(--muted); }
.foot { font-size: .85rem; color: var(--muted); }

/* Video card */
.video { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; padding: 1rem 1.1rem; border-radius: 10px; background: var(--ink); color: var(--paper); text-decoration: none; }
.video .play { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: var(--marker); color: var(--marker-ink); display: grid; place-items: center; font-size: 1.1rem; }
.video .vt { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.video .vt small { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.video .go { font-size: .85rem; opacity: .8; white-space: nowrap; }
.video:hover .go { opacity: 1; }
.covers { gap: .5rem; }
.covers { gap: .65rem; }
.covers li { display: grid; grid-template-columns: 3.5rem 1fr; align-items: baseline; gap: .2rem 0; }
.covers li > :not(span) { grid-column: 2; justify-self: start; }
.covers .vid { font-family: var(--font-mono); font-size: .75rem; font-weight: 500; text-decoration: none; background: var(--ink); color: var(--paper); padding: .15rem .5rem; border-radius: 4px; }
.covers .vid:hover { text-decoration: underline; }

/* Teacher controls */
.row { display: flex; align-items: stretch; }
.row > a { flex: 1; min-width: 0; }
.eye { flex: none; font: 600 .78rem var(--font-mono); letter-spacing: .04em; padding: .35rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; align-self: center; margin: 0 .6rem; }
.eye[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.is-hidden { opacity: .5; }
.is-hidden .topic::after, .is-hidden h2::after { content: " · hidden"; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.units .row { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.units .row .unit-card { border: 0; background: none; }
.resources .row { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.resources .row .res { border: 0; background: none; }
.tpanel { border: 1px dashed var(--accent); border-radius: 10px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; background: var(--surface); }
.tpanel .label { color: var(--accent); }
.field { display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; }
.field input[type="url"], .field input[type="text"] { font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); width: 100%; }
.check { display: flex; gap: .5rem; align-items: center; font-size: .95rem; }
.warn { font-size: .85rem; color: var(--muted); }
.tbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: .6rem calc(.6rem + env(safe-area-inset-bottom, 0px)); }
.tbar-in { max-width: 46rem; margin: 0 auto; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.tbar-in .msg { flex: 1; min-width: 10rem; }
.tbar button { font: 700 .85rem var(--font-body); padding: .45rem .8rem; border-radius: 6px; border: 1px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer; }
.tbar button.primary { background: var(--marker); color: var(--marker-ink); border-color: var(--marker); }
.tbar button:disabled { opacity: .5; cursor: default; }
body.has-tbar .wrap { padding-bottom: 6rem; }
/* Practice */
.practice { margin: 0; padding-left: 1.6rem; display: grid; gap: .75rem; }
.practice li { padding-left: .25rem; }
.practice li::marker { font-family: var(--font-mono); color: var(--muted); }
.practice details { margin-top: .3rem; }
.practice summary { cursor: pointer; font-size: .9rem; color: var(--accent); font-weight: 700; width: fit-content; }
.practice details p { margin-top: .35rem; padding: .6rem .8rem; border-radius: 6px; background: var(--accent-soft); }
.pset { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: .8rem 1rem; }
.pset > summary { cursor: pointer; font-weight: 700; display: flex; gap: .6rem; align-items: baseline; }
.pset > summary span { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); font-weight: 500; flex: none; width: 3.5rem; }
.pset[open] > summary { margin-bottom: .8rem; }
.lcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
.lhead { display: flex; gap: .6rem; align-items: baseline; }
.lhead span { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); flex: none; width: 3.5rem; }
.lhead h3 { font-size: 1.05rem; }
.lhead h3 a { color: var(--ink); }
.lcard .vid { align-self: flex-start; display: inline-flex; flex-wrap: wrap; gap: .25rem; font: 700 .85rem var(--font-body); text-decoration: none; background: var(--ink); color: var(--paper); padding: .45rem .75rem; border-radius: 6px; max-width: 100%; }
.lcard .vid span { font-weight: 400; opacity: .8; }
.lcard .vid:hover { text-decoration: underline; }
.pq > summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: .92rem; width: fit-content; }
.pq[open] > summary { margin-bottom: .6rem; }
.gone { padding: 1.25rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

// Practice questions keyed by day id, each {q, a}. Answers open with a tap, so no script is needed for them.
let PRACTICE = {"uad1": [{"q": "Write 3/4 as a decimal and as a percent.", "a": "3 ÷ 4 = 0.75, which is 75%"}, {"q": "Write 0.4 as a fraction and as a percent.", "a": "0.4 = 4/10 = 2/5, which is 40%"}, {"q": "Write 65% as a decimal and as a fraction in simplest form.", "a": "65% = 0.65 = 65/100 = 13/20"}, {"q": "Write 1/8 as a decimal and as a percent.", "a": "1 ÷ 8 = 0.125, which is 12.5%"}, {"q": "Are 0.6 and 3/5 equivalent? Explain how you know.", "a": "Yes. 3 ÷ 5 = 0.6, so they name the same number"}], "uad2": [{"q": "Order from least to greatest: 0.5, 2/5, 0.45", "a": "2/5 = 0.4. Order: 2/5, 0.45, 0.5"}, {"q": "Order from least to greatest: 3/4, 0.7, 7/8", "a": "3/4 = 0.75 and 7/8 = 0.875. Order: 0.7, 3/4, 7/8"}, {"q": "Order from least to greatest: −1/2, −0.6, 0.1", "a": "−1/2 = −0.5, and −0.6 is farther below zero. Order: −0.6, −1/2, 0.1"}, {"q": "Which is greater, 0.09 or 0.1? Explain.", "a": "0.1 is greater. Line up the decimals: 0.10 vs 0.09, and 10 hundredths is more than 9 hundredths"}, {"q": "Order from least to greatest: 1.25, 5/4, 1.2", "a": "5/4 = 1.25. Order: 1.2, then 1.25 and 5/4, which are equal"}], "uad3": [{"q": "Find 20% of 50.", "a": "0.20 × 50 = 10"}, {"q": "Find 15% of 80.", "a": "0.15 × 80 = 12"}, {"q": "Find 75% of 40.", "a": "0.75 × 40 = 30"}, {"q": "Find 8% of 250.", "a": "0.08 × 250 = 20"}, {"q": "A class has 30 students, and 40% ride the bus. How many students ride the bus?", "a": "0.40 × 30 = 12 students"}], "uad4": [{"q": "A $60 shirt is 25% off. What is the sale price?", "a": "Discount: 0.25 × 60 = $15. Sale price: 60 − 15 = $45"}, {"q": "Shoes cost $80 and the sales tax is 7%. What is the total cost?", "a": "Tax: 0.07 × 80 = $5.60. Total: 80 + 5.60 = $85.60"}, {"q": "A $40 jacket is 30% off, then 5% tax is added to the sale price. What do you pay?", "a": "Discount: 0.30 × 40 = $12, so the sale price is $28. Tax: 0.05 × 28 = $1.40. Total: $29.40"}, {"q": "A meal costs $25 and you leave a 20% tip. What is the total?", "a": "Tip: 0.20 × 25 = $5. Total: $30"}, {"q": "In a price problem, when do you add the percent amount and when do you subtract it?", "a": "Subtract a discount, because the price goes down. Add tax or a tip, because the price goes up"}], "uad6": [{"q": "Find the GCF of 12 and 18.", "a": "Factors of 12: 1, 2, 3, 4, 6, 12. Factors of 18: 1, 2, 3, 6, 9, 18. GCF = 6"}, {"q": "Find the LCM of 4 and 6.", "a": "Multiples of 4: 4, 8, 12… Multiples of 6: 6, 12… LCM = 12"}, {"q": "Find the GCF of 24 and 36.", "a": "GCF = 12"}, {"q": "Find the LCM of 8 and 12.", "a": "Multiples of 8: 8, 16, 24… Multiples of 12: 12, 24… LCM = 24"}, {"q": "Hot dogs come in packs of 10 and buns in packs of 8. What is the fewest of each you can buy to have the same number?", "a": "Find the LCM of 10 and 8: 40. Buy 4 packs of hot dogs and 5 packs of buns"}, {"q": "Is 21 prime or composite? Explain.", "a": "Composite. 21 = 3 × 7, so it has factors other than 1 and itself"}], "uad7": [{"q": "Add: 1/2 + 1/3", "a": "Common denominator 6: 3/6 + 2/6 = 5/6"}, {"q": "Subtract: 3/4 − 1/6", "a": "Common denominator 12: 9/12 − 2/12 = 7/12"}, {"q": "Multiply: 2/3 × 9/10", "a": "18/30 = 3/5"}, {"q": "Divide: 3/5 ÷ 1/2", "a": "Multiply by the reciprocal: 3/5 × 2/1 = 6/5 = 1 1/5"}, {"q": "Add: 1 1/2 + 2 3/4", "a": "3/2 + 11/4 = 6/4 + 11/4 = 17/4 = 4 1/4"}], "uad8": [{"q": "Simplify: 8 + 4 × 3", "a": "Multiply first: 4 × 3 = 12. Then 8 + 12 = 20"}, {"q": "Simplify: (8 + 4) × 3", "a": "Parentheses first: 12 × 3 = 36"}, {"q": "Simplify: 2³ + 6 ÷ 2", "a": "Exponent: 8. Divide: 3. Add: 8 + 3 = 11"}, {"q": "Simplify: 20 − 3(4 − 1)²", "a": "Parentheses: 3. Exponent: 9. Multiply: 3 × 9 = 27. Subtract: 20 − 27 = −7"}, {"q": "Simplify: 18 ÷ 3 × 2", "a": "Multiply and divide from left to right: 18 ÷ 3 = 6, then 6 × 2 = 12"}], "uad9": [{"q": "A class has 12 boys and 15 girls. Write the ratio of boys to girls in simplest form.", "a": "12:15 = 4:5"}, {"q": "The ratio of red to blue marbles is 3:2. There are 18 red marbles. How many blue marbles are there?", "a": "3 × 6 = 18, so multiply 2 by 6 too: 12 blue marbles"}, {"q": "A recipe uses 2 cups of sugar for every 5 cups of flour. How much sugar goes with 15 cups of flour?", "a": "15 ÷ 5 = 3, so 2 × 3 = 6 cups of sugar"}, {"q": "Two numbers are in the ratio 3:5 and add up to 40. What are they?", "a": "3 + 5 = 8 parts, and 40 ÷ 8 = 5 per part. The numbers are 15 and 25"}, {"q": "The ratio of cats to dogs at a shelter is 2:3. What does that mean?", "a": "For every 2 cats, there are 3 dogs"}], "uad10": [{"q": "A car drives 150 miles in 3 hours. What is its speed in miles per hour?", "a": "150 ÷ 3 = 50 miles per hour"}, {"q": "3 pounds of apples cost $4.50. What is the price per pound?", "a": "4.50 ÷ 3 = $1.50 per pound"}, {"q": "Which is the better buy: 12 oz for $3.00 or 16 oz for $3.60?", "a": "12 oz: 3.00 ÷ 12 = $0.25 per oz. 16 oz: 3.60 ÷ 16 = $0.225 per oz. The 16 oz is the better buy"}, {"q": "Maya types 240 words in 4 minutes. How many words per minute is that?", "a": "240 ÷ 4 = 60 words per minute"}, {"q": "5 notebooks cost $6.25. How much does one notebook cost?", "a": "6.25 ÷ 5 = $1.25"}], "uad11": [{"q": "A movie ticket costs $12 and a snack costs $7. Three friends each buy a ticket and a snack. How much do they spend in all?", "a": "Each spends 12 + 7 = $19. Three friends: 3 × 19 = $57"}, {"q": "Jay has $50. He buys 3 books that cost $12 each. How much money does he have left?", "a": "3 × 12 = $36. 50 − 36 = $14 left"}, {"q": "You earn $15 an hour and work 6 hours, then spend $20. How much do you have left?", "a": "15 × 6 = $90. 90 − 20 = $70"}, {"q": "A pizza has 8 slices. 4 friends share 2 pizzas equally. How many slices does each friend get?", "a": "2 × 8 = 16 slices. 16 ÷ 4 = 4 slices each"}, {"q": "Each bus holds 45 students. 160 students are going on a trip with 4 buses. Is there enough room?", "a": "4 × 45 = 180 seats. 180 is more than 160, so yes, with 20 seats to spare"}], "uad13": [{"q": "Books read this week: Mon 4, Tue 7, Wed 3, Thu 6, Fri 5. On which day were the most books read?", "a": "Tuesday, with 7 books"}, {"q": "Using the same table (Mon 4, Tue 7, Wed 3, Thu 6, Fri 5), how many books were read in all?", "a": "4 + 7 + 3 + 6 + 5 = 25 books"}, {"q": "Using the same table, how many more books were read on Tuesday than on Wednesday?", "a": "7 − 3 = 4 more books"}, {"q": "Using the same table, what was the average number of books per day?", "a": "25 ÷ 5 = 5 books per day"}, {"q": "What should you read first when you look at a new table or chart?", "a": "The title and the labels on the rows, columns or axes, so you know what the numbers mean before you use them"}], "uad14": [{"q": "You roll a fair number cube (1–6). What is the probability of rolling a 4?", "a": "1 way out of 6: 1/6"}, {"q": "You roll a fair number cube. What is the probability of rolling an even number?", "a": "2, 4 and 6 are even: 3/6 = 1/2"}, {"q": "A bag has 3 red, 5 blue and 2 green marbles. What is the probability of picking blue?", "a": "5 blue out of 10 marbles: 5/10 = 1/2"}, {"q": "Using the same bag, what is the probability of NOT picking red?", "a": "7 marbles are not red: 7/10"}, {"q": "What is the probability of rolling a 7 on a number cube? What do we call that?", "a": "0. It is impossible"}, {"q": "A spinner has 4 equal sections. What is the probability of landing on one section, as a fraction and a percent?", "a": "1/4, which is 25%"}], "uad15": [{"q": "Find the mean of 4, 8, 6, 5, 8, 11.", "a": "Sum: 42. 42 ÷ 6 = 7"}, {"q": "Find the median of 4, 8, 6, 5, 8, 11.", "a": "In order: 4, 5, 6, 8, 8, 11. The middle two are 6 and 8, so the median is 7"}, {"q": "Find the mode and the range of 4, 8, 6, 5, 8, 11.", "a": "Mode: 8, because it appears most. Range: 11 − 4 = 7"}, {"q": "Quiz scores are 70, 80 and 90. What is the mean?", "a": "(70 + 80 + 90) ÷ 3 = 80"}, {"q": "Home prices are $200k, $210k, $220k and $900k. Which is a better summary, the mean or the median? Why?", "a": "The median. The $900k home is an outlier that pulls the mean up, but it doesn’t change the median much"}], "uad16": [{"q": "Tests count 40% and homework counts 60%. Your test average is 80 and your homework average is 90. What is your grade?", "a": "0.40 × 80 + 0.60 × 90 = 32 + 54 = 86"}, {"q": "Homework is 20%, classwork is 30% and tests are 50%. You score 100, 80 and 70. What is your grade?", "a": "0.20 × 100 + 0.30 × 80 + 0.50 × 70 = 20 + 24 + 35 = 79"}, {"q": "5 students scored 80, 3 scored 90 and 2 scored 100. What is the class average?", "a": "(5 × 80 + 3 × 90 + 2 × 100) ÷ 10 = (400 + 270 + 200) ÷ 10 = 87"}, {"q": "Quiz scores of 70, 80 and 90 count once each, and a test score of 100 counts twice. What is the weighted average?", "a": "(70 + 80 + 90 + 100 + 100) ÷ 5 = 440 ÷ 5 = 88"}, {"q": "How is a weighted average different from a regular average?", "a": "In a weighted average, some values count more than others. In a regular average, every value counts the same"}], "u1d1": [{"q": "Write an expression: the sum of a number and 8", "a": "n + 8"}, {"q": "Write an expression: 5 less than twice a number", "a": "2n − 5. “Less than” means you subtract 5 from twice the number, so the 5 comes second"}, {"q": "Write an expression: the product of 7 and a number, decreased by 3", "a": "7n − 3"}, {"q": "Write an expression: the quotient of a number and 4", "a": "n/4"}, {"q": "Write an expression: three times the difference of a number and 2", "a": "3(n − 2). The parentheses show that you find the difference first"}, {"q": "Which operation does the word “difference” tell you to use? What about “product”?", "a": "Difference means subtraction. Product means multiplication"}], "u1d2": [{"q": "Evaluate 3x + 7 when x = 4.", "a": "3(4) + 7 = 12 + 7 = 19"}, {"q": "Evaluate 2a² − 5 when a = −3.", "a": "2(−3)² − 5 = 2(9) − 5 = 18 − 5 = 13"}, {"q": "Evaluate (m + 6) ÷ 2 when m = 10.", "a": "(10 + 6) ÷ 2 = 16 ÷ 2 = 8"}, {"q": "Evaluate 4xy − y when x = 2 and y = −1.", "a": "4(2)(−1) − (−1) = −8 + 1 = −7"}, {"q": "Evaluate 5(n − 3)² when n = 1.", "a": "5(1 − 3)² = 5(−2)² = 5(4) = 20. Parentheses first, then the exponent, then multiply"}, {"q": "A student said −x² = 9 when x = 3. What went wrong?", "a": "The exponent applies only to x, not the negative sign: −(3²) = −9. The answer is −9"}], "u1d3": [{"q": "Simplify: 4x + 7x", "a": "11x"}, {"q": "Simplify: 3a + 5 − a + 2", "a": "Combine the a terms: 3a − a = 2a. Combine the numbers: 5 + 2 = 7. Answer: 2a + 7"}, {"q": "Simplify: 8m − 3n − 5m + 9n", "a": "8m − 5m = 3m and −3n + 9n = 6n. Answer: 3m + 6n"}, {"q": "Simplify: 6y − 2y² + 4y + y²", "a": "−2y² + y² = −y² and 6y + 4y = 10y. Answer: −y² + 10y"}, {"q": "Are 5x and 5x² like terms? Explain.", "a": "No. Like terms need the same variable with the same exponent. x and x² have different exponents"}], "u1d4": [{"q": "Simplify: 3(x + 4)", "a": "3x + 12"}, {"q": "Simplify: −2(5y − 3)", "a": "−10y + 6. The −2 multiplies both terms, and −2 × −3 = +6"}, {"q": "Simplify: 4(2a + 1) + 3a", "a": "Distribute: 8a + 4 + 3a. Combine like terms: 11a + 4"}, {"q": "Simplify: 6 − 2(x − 5)", "a": "Distribute the −2: 6 − 2x + 10. Combine: −2x + 16"}, {"q": "Simplify: 3(2m − 1) − (m + 4)", "a": "6m − 3 − m − 4. Combine: 5m − 7. The minus sign in front of the parentheses changes the sign of both terms"}], "u1d6": [{"q": "Multiply: (x + 3)(x + 5)", "a": "x² + 5x + 3x + 15 = x² + 8x + 15"}, {"q": "Multiply: (x − 4)(x + 2)", "a": "x² + 2x − 4x − 8 = x² − 2x − 8"}, {"q": "Multiply: (a + 6)(a − 1)", "a": "a² − a + 6a − 6 = a² + 5a − 6"}, {"q": "Multiply: (2x + 1)(x − 3)", "a": "2x² − 6x + x − 3 = 2x² − 5x − 3"}, {"q": "Multiply: (3y − 2)(2y − 5)", "a": "6y² − 15y − 4y + 10 = 6y² − 19y + 10"}], "u1d7": [{"q": "Multiply: (x + 4)²", "a": "(x + 4)(x + 4) = x² + 8x + 16"}, {"q": "Multiply: (x − 5)²", "a": "(x − 5)(x − 5) = x² − 10x + 25"}, {"q": "Multiply: (x + 7)(x − 7)", "a": "x² − 7x + 7x − 49 = x² − 49. The middle terms cancel"}, {"q": "Multiply: (2y + 3)²", "a": "(2y + 3)(2y + 3) = 4y² + 12y + 9"}, {"q": "Multiply: (3a − 1)(3a + 1)", "a": "9a² − 1"}, {"q": "A student wrote (x + 3)² = x² + 9. What did they miss?", "a": "(x + 3)² means (x + 3)(x + 3) = x² + 3x + 3x + 9 = x² + 6x + 9. They left out the middle term, 6x"}], "u1d8": [{"q": "Simplify: x/3 + x/6", "a": "Common denominator 6: 2x/6 + x/6 = 3x/6 = x/2"}, {"q": "Simplify: 2x/5 − x/10", "a": "Common denominator 10: 4x/10 − x/10 = 3x/10"}, {"q": "Simplify: x/2 + 3/4", "a": "Common denominator 4: 2x/4 + 3/4 = (2x + 3)/4"}, {"q": "Simplify: (3x/4) · (8/x)", "a": "Multiply straight across: 24x/4x. Simplify: 6"}, {"q": "Simplify: (2a/3) ÷ (a/6)", "a": "Multiply by the reciprocal: (2a/3) · (6/a) = 12a/3a = 4"}, {"q": "When do you need a common denominator: adding, or multiplying fractions?", "a": "Adding and subtracting need a common denominator. Multiplying doesn’t: multiply straight across. To divide, multiply by the reciprocal"}], "u1d9": [{"q": "A rectangle is 8 cm long and 5 cm wide. Find its perimeter and area.", "a": "Perimeter = 2(8) + 2(5) = 26 cm. Area = 8 × 5 = 40 cm²"}, {"q": "A triangle has a base of 10 in and a height of 6 in. Find its area.", "a": "Area = ½ × 10 × 6 = 30 in²"}, {"q": "A right triangle has sides 6 m, 8 m and 10 m. Find its perimeter and area.", "a": "Perimeter = 6 + 8 + 10 = 24 m. The legs are 6 and 8, so area = ½ × 6 × 8 = 24 m²"}, {"q": "A square has a perimeter of 36 ft. What is its area?", "a": "Each side is 36 ÷ 4 = 9 ft. Area = 9 × 9 = 81 ft²"}, {"q": "A rectangle is (x + 3) units long and 4 units wide. Write expressions for its perimeter and area.", "a": "Perimeter = 2(x + 3) + 2(4) = 2x + 14. Area = 4(x + 3) = 4x + 12"}, {"q": "What is the difference between perimeter and area?", "a": "Perimeter is the distance around a shape, measured in units like cm. Area is the space inside, measured in square units like cm²"}], "u2d1": [{"q": "Solve: x + 9 = 23", "a": "Subtract 9 from both sides: x = 14"}, {"q": "Solve: y − 6 = −11", "a": "Add 6 to both sides: y = −5"}, {"q": "Solve: −4m = 36", "a": "Divide both sides by −4: m = −9"}, {"q": "Solve: n ÷ 5 = −3", "a": "Multiply both sides by 5: n = −15"}, {"q": "Solve: 7 + k = 2. Which inverse operation did you use, and why?", "a": "Subtract 7 from both sides, because subtraction undoes adding 7 and isolates k. k = −5"}], "u2d2": [{"q": "Solve: 3x + 5 = 20", "a": "Subtract 5: 3x = 15. Divide by 3: x = 5"}, {"q": "Solve: −2y − 7 = 9", "a": "Add 7: −2y = 16. Divide by −2: y = −8"}, {"q": "Solve: x/4 + 6 = 1", "a": "Subtract 6: x/4 = −5. Multiply by 4: x = −20"}, {"q": "Solve: 10 = 5 − m", "a": "Subtract 5: 5 = −m. Divide by −1: m = −5"}, {"q": "Jada solved 2x + 8 = 14 by dividing by 2 first and got x + 8 = 7, so x = −1. What went wrong?", "a": "She divided only the 2x by 2, not the 8. Undo the addition first: 2x = 6, so x = 3. Check: 2(3) + 8 = 14 ✓"}], "u2d3": [{"q": "A gym charges $25 to join plus $15 per month. Maria paid $115 in total. Write and solve an equation to find how many months she paid for.", "a": "25 + 15m = 115. Subtract 25: 15m = 90. Divide by 15: m = 6 months"}, {"q": "Devon bought 4 movie tickets and a $6 popcorn. He spent $50. How much was each ticket?", "a": "4t + 6 = 50. Subtract 6: 4t = 44. Divide by 4: t = $11"}, {"q": "The temperature was −3°F in the morning and 12°F in the afternoon. By how many degrees did it rise?", "a": "−3 + r = 12. Add 3: r = 15 degrees"}, {"q": "A phone plan costs $40 per month. Sam has paid $280 so far. How many months has he had the plan?", "a": "40m = 280. Divide by 40: m = 7 months"}, {"q": "Sofia has $18 and saves $6 each week. How many weeks until she has $60?", "a": "18 + 6w = 60. Subtract 18: 6w = 42. Divide by 6: w = 7 weeks"}], "u2d4": [{"q": "Solve: 3(x + 4) = 27", "a": "Distribute: 3x + 12 = 27. Subtract 12: 3x = 15. x = 5"}, {"q": "Solve: 6x − 2x + 3 = 31", "a": "Combine like terms: 4x + 3 = 31. Subtract 3: 4x = 28. x = 7"}, {"q": "Solve: −2(3y − 1) = 26", "a": "Distribute: −6y + 2 = 26. Subtract 2: −6y = 24. y = −4"}, {"q": "Solve: 4(m − 2) + 3m = 20", "a": "Distribute: 4m − 8 + 3m = 20. Combine like terms: 7m − 8 = 20. Add 8: 7m = 28. m = 4"}, {"q": "Solve: 5(n + 1) − 2n = 17", "a": "Distribute: 5n + 5 − 2n = 17. Combine like terms: 3n + 5 = 17. Subtract 5: 3n = 12. n = 4"}], "u2d5": [{"q": "Solve: x/6 = 10/15", "a": "Cross multiply: 15x = 60. x = 4"}, {"q": "Solve: 3/8 = 12/y", "a": "Cross multiply: 3y = 96. y = 32"}, {"q": "Solve: (x + 2)/5 = 6/10", "a": "Cross multiply: 10(x + 2) = 30. Divide by 10: x + 2 = 3. x = 1"}, {"q": "Solve: 4/(m − 1) = 2/3", "a": "Cross multiply: 12 = 2(m − 1). Divide by 2: 6 = m − 1. m = 7"}, {"q": "Do 4/10 and 6/15 form a proportion? Explain how you know.", "a": "Yes. Cross products are equal: 4 × 15 = 60 and 10 × 6 = 60, so the two ratios are equal"}], "u2d6": [{"q": "3 cups of flour make 24 cookies. How many cups do you need for 40 cookies?", "a": "3/24 = c/40. Cross multiply: 24c = 120. c = 5 cups"}, {"q": "On a map, 1 inch = 25 miles. Two towns are 3.5 inches apart on the map. How far apart are they really?", "a": "1/25 = 3.5/d. Cross multiply: d = 87.5 miles"}, {"q": "A car goes 150 miles on 6 gallons of gas. How far can it go on 10 gallons?", "a": "150/6 = d/10. Cross multiply: 6d = 1500. d = 250 miles"}, {"q": "A 6-foot person casts a 4-foot shadow. At the same time, a tree casts an 18-foot shadow. How tall is the tree?", "a": "6/4 = h/18. Cross multiply: 4h = 108. h = 27 feet"}, {"q": "5 notebooks cost $8. How much do 15 notebooks cost?", "a": "5/8 = 15/c. Cross multiply: 5c = 120. c = $24"}], "u2d7": [{"q": "Solve: 5x + 3 = 2x + 18", "a": "Subtract 2x: 3x + 3 = 18. Subtract 3: 3x = 15. x = 5"}, {"q": "Solve: 7y − 4 = 3y + 12", "a": "Subtract 3y: 4y − 4 = 12. Add 4: 4y = 16. y = 4"}, {"q": "Solve: 2(m + 3) = 5m − 9", "a": "Distribute: 2m + 6 = 5m − 9. Subtract 2m: 6 = 3m − 9. Add 9: 15 = 3m. m = 5"}, {"q": "Solve: −3n + 8 = n − 4", "a": "Add 3n: 8 = 4n − 4. Add 4: 12 = 4n. n = 3"}, {"q": "Solve: 6 − 2x = 4x − 18", "a": "Add 2x: 6 = 6x − 18. Add 18: 24 = 6x. x = 4"}], "u2d9": [{"q": "How many solutions? 3(x + 2) = 3x + 6", "a": "Distribute: 3x + 6 = 3x + 6. Subtract 3x: 6 = 6, which is always true. Infinitely many solutions"}, {"q": "How many solutions? 4x − 5 = 4x + 1", "a": "Subtract 4x: −5 = 1, which is never true. No solution"}, {"q": "How many solutions? 2(x − 3) = 2x − 4", "a": "Distribute: 2x − 6 = 2x − 4. Subtract 2x: −6 = −4, which is never true. No solution"}, {"q": "How many solutions? 5x + 2 = 3x + 2", "a": "Subtract 3x: 2x + 2 = 2. Subtract 2: 2x = 0. x = 0, so there is one solution. Watch out: x = 0 is a real answer, not “no solution”"}, {"q": "Fill in the blank so that 6x + 4 = 6x + ___ has (a) no solution, (b) infinitely many solutions.", "a": "(a) Any number except 4, such as 6x + 4 = 6x + 9. (b) 4, so both sides are exactly the same"}], "u2d10": [{"q": "Solve: |x| = 9", "a": "x = 9 or x = −9"}, {"q": "Solve: |x − 3| = 5", "a": "x − 3 = 5 gives x = 8. x − 3 = −5 gives x = −2"}, {"q": "Solve: |2x + 1| = 7", "a": "2x + 1 = 7 gives x = 3. 2x + 1 = −7 gives x = −4"}, {"q": "Solve: |x| + 4 = 10", "a": "Isolate the absolute value first: |x| = 6. x = 6 or x = −6"}, {"q": "Solve: 3|x − 1| = 12", "a": "Divide by 3: |x − 1| = 4. x − 1 = 4 gives x = 5. x − 1 = −4 gives x = −3"}, {"q": "Solve: |x + 2| = −3", "a": "No solution. Absolute value measures distance from zero, and a distance can’t be negative"}], "u2d11": [{"q": "Solve P = 4s for s.", "a": "Divide both sides by 4: s = P/4"}, {"q": "Solve A = lw for w.", "a": "Divide both sides by l: w = A/l"}, {"q": "Solve d = rt for t.", "a": "Divide both sides by r: t = d/r"}, {"q": "Solve y = mx + b for b.", "a": "Subtract mx from both sides: b = y − mx"}, {"q": "Solve P = 2l + 2w for l.", "a": "Subtract 2w: P − 2w = 2l. Divide by 2: l = (P − 2w)/2"}], "u2d12": [{"q": "Solve 3x + 2y = 12 for y.", "a": "Subtract 3x: 2y = 12 − 3x. Divide by 2: y = (12 − 3x)/2"}, {"q": "Solve A = ½bh for h.", "a": "Multiply both sides by 2: 2A = bh. Divide by b: h = 2A/b"}, {"q": "Solve y = mx + b for x.", "a": "Subtract b: y − b = mx. Divide by m: x = (y − b)/m"}, {"q": "Solve ax + b = c for x.", "a": "Subtract b: ax = c − b. Divide by a: x = (c − b)/a"}, {"q": "Solve V = πr²h for h.", "a": "Divide both sides by πr²: h = V/(πr²)"}, {"q": "Solve C = 5/9(F − 32) for F.", "a": "Multiply both sides by 9/5: 9C/5 = F − 32. Add 32: F = 9C/5 + 32"}], "u2d13": [{"q": "A price goes from $40 to $50. Find the percent change. Is it an increase or a decrease?", "a": "(50 − 40) ÷ 40 = 0.25, so a 25% increase"}, {"q": "A price goes from $80 to $60. Find the percent change.", "a": "(60 − 80) ÷ 80 = −0.25, so a 25% decrease"}, {"q": "Shoes that cost $75 are on sale for $60. What is the percent change?", "a": "(60 − 75) ÷ 75 = −0.20, so a 20% decrease"}, {"q": "A class grows from 25 students to 30 students. What is the percent change?", "a": "(30 − 25) ÷ 25 = 0.20, so a 20% increase"}, {"q": "A phone’s price rises from $200 to $230. What is the percent change?", "a": "(230 − 200) ÷ 200 = 0.15, so a 15% increase"}, {"q": "A town’s population changed by −10%. What does the negative sign tell you?", "a": "The population decreased. A negative percent change means the new amount is less than the original amount"}], "u3d1": [{"q": "Solve and graph: x + 5 > 12", "a": "Subtract 5: x > 7. Graph: open circle at 7, shade to the right"}, {"q": "Solve and graph: y − 3 ≤ −8", "a": "Add 3: y ≤ −5. Graph: closed circle at −5, shade to the left"}, {"q": "Solve: 4m ≥ 20", "a": "Divide by 4: m ≥ 5"}, {"q": "Solve: 2x + 3 < 11", "a": "Subtract 3: 2x < 8. Divide by 2: x < 4"}, {"q": "Is x = 6 a solution of 3x − 4 > 14? Explain.", "a": "No. 3(6) − 4 = 14, and 14 > 14 is false. Only numbers greater than 6 work"}, {"q": "How is x + 2 = 5 different from x + 2 > 5?", "a": "The equation has one solution, x = 3. The inequality has many solutions: every number greater than 3"}], "u4d1": [{"q": "Find the domain and range of {(1, 4), (2, 5), (3, 6)}.", "a": "Domain (x-values): {1, 2, 3}. Range (y-values): {4, 5, 6}"}, {"q": "Find the domain and range of {(−2, 0), (0, 3), (4, 3), (5, −1)}.", "a": "Domain: {−2, 0, 4, 5}. Range: {−1, 0, 3}. List 3 only once"}, {"q": "Which quadrant is the point (−3, 5) in?", "a": "Quadrant II: x is negative and y is positive"}, {"q": "Start at the origin, move 4 right and 2 down. What point are you at?", "a": "(4, −2)"}, {"q": "What is the difference between the domain and the range?", "a": "The domain is all the inputs (x-values). The range is all the outputs (y-values)"}], "u4d2": [{"q": "Is {(1, 2), (2, 4), (3, 6)} a function? Explain.", "a": "Yes. Each input has exactly one output"}, {"q": "Is {(1, 2), (1, 5), (3, 6)} a function? Explain.", "a": "No. The input 1 has two different outputs, 2 and 5"}, {"q": "How does the vertical line test tell you if a graph is a function?", "a": "If any vertical line crosses the graph more than once, it is not a function. If every vertical line crosses at most once, it is a function"}, {"q": "Is a circle the graph of a function?", "a": "No. A vertical line through the middle crosses the circle twice"}, {"q": "Make a table for y = 2x + 1 using x = 0, 1, 2.", "a": "x = 0 → y = 1. x = 1 → y = 3. x = 2 → y = 5"}, {"q": "Is the horizontal line y = 3 a function? What about the vertical line x = 3?", "a": "y = 3 is a function: every vertical line crosses it once. x = 3 is not: it is itself a vertical line, so one input has infinitely many outputs"}], "u4d3": [{"q": "You earn money for each hour you work. Which is the independent variable and which is the dependent variable?", "a": "Independent: hours worked. Dependent: money earned, because it depends on the hours"}, {"q": "On a graph, which axis shows the independent variable?", "a": "The x-axis (horizontal). The dependent variable goes on the y-axis"}, {"q": "A plant is 5 cm tall and grows 2 cm each week. Make a table for weeks 0 to 3.", "a": "Week 0: 5 cm. Week 1: 7 cm. Week 2: 9 cm. Week 3: 11 cm"}, {"q": "A graph of temperature over time slopes downward. What does that tell you?", "a": "As time goes on, the temperature goes down"}, {"q": "Tickets cost $8 each. Which depends on which: the number of tickets or the total cost?", "a": "The total cost depends on the number of tickets. Tickets are independent, cost is dependent"}], "u4d4": [{"q": "Linear or nonlinear? x: 0, 1, 2, 3 and y: 2, 5, 8, 11", "a": "Linear. y goes up by 3 every time x goes up by 1, a constant rate of change"}, {"q": "Linear or nonlinear? x: 0, 1, 2, 3 and y: 1, 2, 4, 8", "a": "Nonlinear. y doubles each time, so the change is not constant (+1, +2, +4)"}, {"q": "Linear or nonlinear? x: 1, 2, 3, 4 and y: 1, 4, 9, 16", "a": "Nonlinear. The changes are +3, +5, +7, which are not constant"}, {"q": "Which equation is linear: y = 4x − 1 or y = x²?", "a": "y = 4x − 1 is linear. y = x² is nonlinear, because x is squared"}, {"q": "How can you tell from a graph whether a function is linear?", "a": "A linear function’s graph is a straight, nonvertical line. A nonlinear function’s graph curves"}], "u4d6": [{"q": "A graph of f passes through (−2, 3), (0, 1), (2, −1) and (4, −3). What is f(0)?", "a": "f(0) = 1. Find x = 0 and read the y-value"}, {"q": "Using the same graph, what is f(2)?", "a": "f(2) = −1"}, {"q": "Using the same graph, for what x-value is f(x) = 3?", "a": "x = −2. Find y = 3 on the graph and read the x-value"}, {"q": "Using the same graph, what is f(4) − f(0)?", "a": "f(4) = −3 and f(0) = 1, so −3 − 1 = −4"}, {"q": "What does f(2) = −1 mean on a graph?", "a": "The point (2, −1) is on the graph: when the input is 2, the output is −1"}], "u4d7": [{"q": "If f(x) = 3x + 2, find f(4).", "a": "f(4) = 3(4) + 2 = 14"}, {"q": "If f(x) = 3x + 2, find f(−1).", "a": "f(−1) = 3(−1) + 2 = −1"}, {"q": "If g(x) = x² − 5, find g(3).", "a": "g(3) = 9 − 5 = 4"}, {"q": "If h(x) = 10 − 2x, find h(−3).", "a": "h(−3) = 10 − 2(−3) = 10 + 6 = 16"}, {"q": "If f(x) = 3x + 2, for what x is f(x) = 20?", "a": "3x + 2 = 20. 3x = 18. x = 6"}], "u4d8": [{"q": "f(x) = 2x + 1 and g(x) = x − 3. Find f(g(5)).", "a": "Inside first: g(5) = 2. Then f(2) = 5"}, {"q": "f(x) = 2x + 1 and g(x) = x − 3. Find g(f(5)).", "a": "f(5) = 11. Then g(11) = 8"}, {"q": "f(x) = 2x + 1. Find f(f(1)).", "a": "f(1) = 3. Then f(3) = 7"}, {"q": "f(x) = 2x + 1 and h(x) = x². Find f(h(3)).", "a": "h(3) = 9. Then f(9) = 19"}, {"q": "f(x) = 2x + 1 and g(x) = x − 3. Write f(g(x)) as an expression.", "a": "Replace x in f with (x − 3): 2(x − 3) + 1 = 2x − 5"}, {"q": "In f(g(x)), which function do you evaluate first? Why?", "a": "g, the inside function. Its output becomes the input for f"}], "u3d3": [{"q": "Solve: 5x + 2 > 3x + 10", "a": "Subtract 3x: 2x + 2 > 10. Subtract 2: 2x > 8. Divide by 2: x > 4"}, {"q": "Solve: 7y − 4 ≤ 2y + 11", "a": "Subtract 2y: 5y − 4 ≤ 11. Add 4: 5y ≤ 15. y ≤ 3"}, {"q": "Solve: 2m + 9 ≥ 5m − 3", "a": "Subtract 5m: −3m + 9 ≥ −3. Subtract 9: −3m ≥ −12. Divide by −3 and flip: m ≤ 4"}, {"q": "Solve: 4(n − 1) < 6n + 2", "a": "Distribute: 4n − 4 < 6n + 2. Subtract 6n: −2n − 4 < 2. Add 4: −2n < 6. Divide by −2 and flip: n > −3"}, {"q": "Solve: 3x + 5 > 3x + 1. What happens?", "a": "Subtract 3x: 5 > 1, which is always true. Every number is a solution: all real numbers"}, {"q": "Fill in the blank so 2x + 4 > 2x + ___ has (a) no solution, (b) all real numbers as solutions.", "a": "After subtracting 2x you get 4 > ___. (a) Any number 4 or greater, such as 9, makes it never true. (b) Any number less than 4, such as 1, makes it always true"}], "u3d4": [{"q": "Solve: x > 2 and x > 5", "a": "Both must be true. Any number greater than 5 is also greater than 2, so the answer is x > 5. The x > 2 part is redundant"}, {"q": "Solve: x < 1 and x > 4", "a": "No number is less than 1 and greater than 4 at the same time. No solution"}, {"q": "Solve: x < 3 or x > 1", "a": "Every number is either less than 3 or greater than 1 (or both). All real numbers"}, {"q": "Solve: x ≤ 6 or x ≤ 2", "a": "Only one needs to be true. Anything 2 or less is also 6 or less, so the answer is x ≤ 6"}, {"q": "Solve: 2x > 4 and x + 1 < 0", "a": "2x > 4 gives x > 2. x + 1 < 0 gives x < −1. No number is both, so there is no solution"}, {"q": "What is the difference between a redundant inequality and a no-solution inequality?", "a": "Redundant: one part is already covered by the other, so you can drop it and solutions still exist. No solution: the two parts can never both be true, so no number works"}], "u3d5": [{"q": "Write a compound inequality: a number x is greater than −2 and less than 5.", "a": "−2 < x < 5"}, {"q": "Write a compound inequality: a number x is less than 0 or at least 4.", "a": "x < 0 or x ≥ 4"}, {"q": "Riders on a ride must be at least 8 and at most 14 years old. Write an inequality for age a.", "a": "8 ≤ a ≤ 14"}, {"q": "A graph has an open circle at 1, a closed circle at 6, and shading between them. Write the inequality.", "a": "1 < x ≤ 6"}, {"q": "Is x = 3 a solution of x < 2 or x > 5? Explain.", "a": "No. 3 is not less than 2 and not greater than 5, so neither part is true"}, {"q": "What is the difference between an “and” (intersection) inequality and an “or” (union) inequality?", "a": "And: both parts must be true, so the solution is where the graphs overlap. Or: at least one part must be true, so the solution includes both graphs"}], "u3d6": [{"q": "Solve: −3 < x + 2 < 7", "a": "Subtract 2 from all three parts: −5 < x < 5"}, {"q": "Solve: 1 ≤ 2x − 3 ≤ 9", "a": "Add 3: 4 ≤ 2x ≤ 12. Divide by 2: 2 ≤ x ≤ 6"}, {"q": "Solve: x − 4 < −6 or x + 1 > 5", "a": "x < −2 or x > 4"}, {"q": "Solve: −2x > 8 or 3x ≥ 9", "a": "−2x > 8: divide by −2 and flip, x < −4. 3x ≥ 9: x ≥ 3. Answer: x < −4 or x ≥ 3"}, {"q": "Solve: −5 < −x + 1 ≤ 3", "a": "Subtract 1: −6 < −x ≤ 2. Divide by −1 and flip both signs: 6 > x ≥ −2, which is −2 ≤ x < 6"}], "u3d7": [{"q": "Movie tickets cost $6 and you have $40. Write and solve an inequality for the most tickets you can buy.", "a": "6t ≤ 40, so t ≤ 6.67. You can’t buy part of a ticket, so the most is 6 tickets"}, {"q": "You need at least 75 points to pass. You have 52. How many more points p do you need?", "a": "52 + p ≥ 75, so p ≥ 23. You need at least 23 more points"}, {"q": "A phone plan costs $25 plus $0.10 per text. You want to spend at most $40. How many texts t can you send?", "a": "25 + 0.10t ≤ 40. Subtract 25: 0.10t ≤ 15. Divide by 0.10: t ≤ 150 texts"}, {"q": "An elevator holds at most 2,000 lb. A 180-lb worker loads boxes that weigh 50 lb each. How many boxes b can go on?", "a": "180 + 50b ≤ 2000. Subtract 180: 50b ≤ 1820. b ≤ 36.4, so at most 36 boxes. Round down, because 37 boxes would be too heavy"}, {"q": "Which inequality sign goes with each phrase: at least, at most, more than, fewer than?", "a": "At least: ≥. At most: ≤. More than: >. Fewer than: <"}], "u3dx1": [{"q": "Write x > 3 in interval notation.", "a": "(3, ∞). Use a parenthesis because 3 is not included"}, {"q": "Write x ≤ −1 in interval notation.", "a": "(−∞, −1]. Use a bracket because −1 is included"}, {"q": "Write −2 ≤ x < 5 in interval notation.", "a": "[−2, 5)"}, {"q": "Write x < 0 or x ≥ 4 in interval notation.", "a": "(−∞, 0) ∪ [4, ∞). The ∪ symbol means “or” (union)"}, {"q": "Write [1, 6] as an inequality.", "a": "1 ≤ x ≤ 6"}, {"q": "Why do we always use a parenthesis next to ∞?", "a": "Infinity is not a number you can reach, so it can never be included in the interval"}], "u3d2": [{"q": "Solve: −3x > 12", "a": "Divide by −3 and flip the sign: x < −4"}, {"q": "Solve: 5 − 2y ≤ 11", "a": "Subtract 5: −2y ≤ 6. Divide by −2 and flip: y ≥ −3"}, {"q": "Solve: 2(x + 4) > 18", "a": "Distribute: 2x + 8 > 18. Subtract 8: 2x > 10. Divide by 2: x > 5. No flip, because you divided by a positive number"}, {"q": "Solve: −4(m − 1) ≥ 20", "a": "Distribute: −4m + 4 ≥ 20. Subtract 4: −4m ≥ 16. Divide by −4 and flip: m ≤ −4"}, {"q": "Solve: 3n − 7n + 2 < 18", "a": "Combine like terms: −4n + 2 < 18. Subtract 2: −4n < 16. Divide by −4 and flip: n > −4"}, {"q": "Solve: x/(−2) + 1 ≤ 4", "a": "Subtract 1: x/(−2) ≤ 3. Multiply by −2 and flip: x ≥ −6"}, {"q": "Why do you flip the sign when you multiply or divide by a negative? Use −2 < 3 as an example.", "a": "−2 < 3 is true. Multiply both sides by −1 and you get 2 and −3, but 2 < −3 is false. Flipping the sign gives 2 > −3, which is true. Multiplying by a negative reverses the order of numbers"}]};

const SUMMARY = {
  ua: "Rational numbers, percents, fractions, order of operations, ratios and rates, and an introduction to data and probability.",
  u1: "Translating, evaluating and simplifying expressions, multiplying binomials, and area and perimeter.",
  u2: "One-step, two-step and multi-step equations, proportions, absolute value, literal equations and percent change.",
  u3: "Solving one-step, multi-step and compound inequalities and writing inequalities from word problems.",
  u4: "Domain and range, function rules, linear and nonlinear patterns, and function notation.",
  ub: "Box plots, data displays, central tendency, probability, counting, and unit and rate conversions.",
  u5: "Intercepts, slope, slope-intercept form, writing equations of lines, scatterplots and graphing.",
  u6: "Solving systems by graphing, substitution and elimination, and systems of linear inequalities.",

// Settings: what is hidden from students and which lessons have a video. Saved inside the page.
function readSettings() {
  try {
    const s = JSON.parse(document.getElementById("settings").textContent);
    return { hidden: s.hidden || {}, videos: s.videos || {}, videoReplacesNotes: !!s.videoReplacesNotes, videoPracticeOnly: !!s.videoPracticeOnly, schedule: s.schedule || {} };
  } catch { return { hidden: {}, videos: {}, videoReplacesNotes: false, videoPracticeOnly: false, schedule: {} }; }
}
let saved = readSettings();
let draft = structuredClone(saved);
let teacher = { allowed: false, on: false, saving: false, artifact: null, error: "" };

const ss = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }
};

const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dayId = (u, day) => `${u.id}d${day.d}`;
const isLesson = day => !day.event && !day.extension;
const S = () => teacher.on ? draft : saved;   // teacher view previews unsaved changes

// Scheduled lessons open at 6:00 am Chicago time on their date.
function chicagoNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, hour: +p.hour };
}
const notOpenYet = id => {
  const d = S().schedule?.[id];
  if (!d) return false;
  const now = chicagoNow();
  return now.date < d || (now.date === d && now.hour < 6);
};
const opensLabel = id => new Date(S().schedule[id] + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const unitHidden = u => !!S().hidden[u.id];
// In video-and-practice mode, a lesson with neither has nothing to show yet, so it stays hidden.
const empty = (u, day) => S().videoPracticeOnly && !day.event && !(S().videos[dayId(u, day)]?.live) && !PRACTICE[dayId(u, day)];
const dayClosed = (u, day) => !!S().hidden[dayId(u, day)] || notOpenYet(dayId(u, day)) || empty(u, day);
const dayHidden = (u, day) => unitHidden(u) || dayClosed(u, day);
// Students see a unit only once at least one of its days is open.
const unitShown = u => teacher.on || (!unitHidden(u) && u.days.some(d => !dayClosed(u, d)));
const liveVideo = (u, day) => { const v = S().videos[dayId(u, day)]; return v && v.url && v.live ? v : null; };
const resHidden = (u, day, r) => !!S().hidden[`${dayId(u, day)}:${r.kind}`] ||
  (S().videoReplacesNotes && r.kind === "Notes" && !!liveVideo(u, day));
// Students never see hidden things; the teacher sees them dimmed.
const shows = hidden => teacher.on || !hidden;

const dirty = () => JSON.stringify(draft) !== JSON.stringify(saved);
function setHidden(key, value) {
  if (value) draft.hidden[key] = true; else delete draft.hidden[key];
  ss.set("draft", JSON.stringify(draft));
  route(false);
}
const eye = (key, hidden, what) => teacher.on
  ? `<button type="button" class="eye" data-key="${esc(key)}" aria-pressed="${hidden}" aria-label="${hidden ? "Show" : "Hide"} ${esc(what)} for students">${hidden ? "Hidden" : "Visible"}</button>`
  : "";

function coveredBy(u, day) {
  const i = u.days.indexOf(day);
  if (day.event === "quiz") {
    const out = [];
    for (let j = i - 1; j >= 0 && u.days[j].event !== "quiz"; j--) if (isLesson(u.days[j])) out.unshift(u.days[j]);
    return out;
  }
  return u.days.slice(0, i).filter(isLesson);
}

function renderHome() {
  crumbs.innerHTML = "";
  document.title = "Algebra 1 Class Site";
  const units = UNITS.filter(unitShown);
  app.innerHTML = `
    <section class="hero">
      <p class="eyebrow">Algebra 1</p>
      <h1>Class lessons</h1>
      <p class="lede">${S().videoPracticeOnly ? "Pick a unit, then a lesson, to watch its video and try the practice questions." : "Pick a unit, then a day, to find that day’s objective, video, notes, homework and exit ticket."}</p>
    </section>
    ${teacher.on ? `
    <section class="tpanel">
      <p class="label">Teacher settings</p>
      <label class="check"><input type="checkbox" id="opt-video-only" ${draft.videoPracticeOnly ? "checked" : ""}> Lesson pages show only the video and practice questions</label>
      <label class="check"><input type="checkbox" id="opt-replace-notes" ${draft.videoReplacesNotes ? "checked" : ""}> When a lesson has a video that students can see, hide its notes</label>
    </section>` : ""}
    <section class="units">
      ${units.map(u => `
        <div class="row ${unitHidden(u) ? "is-hidden" : ""}">
          <a class="unit-card" href="#${u.id}">
            <span class="badge" aria-hidden="true">${esc(u.label)}</span>
            <span class="text">
              <span class="eyebrow">Unit ${esc(u.label)}</span>
              <h2>${esc(u.title)}</h2>
              <span class="meta">${u.days.filter(d => !d.extension).length} days</span>
            </span>
          </a>
          ${eye(u.id, unitHidden(u), "Unit " + u.label)}
        </div>`).join("")}
    </section>`;
}

function renderUnit(u) {
  crumbs.innerHTML = `<a href="#home">Home</a><span>/</span><span>Unit ${esc(u.label)}</span>`;
  document.title = `Unit ${u.label}: ${u.title}`;
  const groups = [];
  for (const day of u.days) {
    if (!shows(dayClosed(u, day))) continue;
    const key = day.extension ? "ext" : day.week;
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, days: [] });
    g.days.push(day);
  }
  app.innerHTML = `
    <section class="hero ${unitHidden(u) ? "is-hidden" : ""}">
      <p class="eyebrow">Unit ${esc(u.label)}</p>
      <h1>${esc(u.title)}</h1>
      <p class="lede">${esc(SUMMARY[u.id] || "")}</p>
    </section>
    ${teacher.on ? `<section class="tpanel"><p class="label">Teacher</p><div class="row" style="align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><span>${unitHidden(u) ? "Students can’t see this unit." : "Students can see this unit."} Hide single days with the buttons below.</span>${eye(u.id, unitHidden(u), "this unit")}</div></section>` : ""}
    ${groups.map(g => `
      <section class="week">
        <p class="label">${g.key === "ext" ? "Extension lessons (optional)" : `Week ${g.key}`}</p>
        <ol class="days">
          ${g.days.map(day => {
            const hid = dayClosed(u, day);
            return `
            <li class="row ${hid ? "is-hidden" : ""}"><a href="#${dayId(u, day)}">
              <span class="num">${day.extension ? "Ext. " + day.label.split(" ")[1] : esc(day.label)}</span>
              <span class="topic">${esc(day.topic)}</span>
              ${teacher.on && notOpenYet(dayId(u, day)) ? `<span class="chip ext">opens ${opensLabel(dayId(u, day))}</span>` : day.event ? `<span class="chip">${day.event}</span>` : day.extension ? `<span class="chip ext">extension</span>` : liveVideo(u, day) ? `<span class="chip ext">video</span>` : ""}
            </a>${eye(dayId(u, day), hid, day.label)}</li>`;
          }).join("")}
        </ol>
      </section>`).join("")}`;
}

function videoCard(v, draftNote) {
  return `
    <a class="video" href="${esc(v.url)}" target="_blank" rel="noopener">
      <span class="play" aria-hidden="true">▶</span>

    ${covered.length ? `
    <section class="week">
      <p class="label">${day.event === "test" ? "Lessons on the test" : "Lessons to review"} · watch the video, then try the practice</p>
      ${covered.map(lessonCard).join("")}
    </section>` : ""}`;
}

function videoEditor(u, day) {
  const id = dayId(u, day);
  const v = draft.videos[id] || {};
  const bad = v.url && !/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(v.url);
  return `
    <section class="tpanel">
      <p class="label">Teacher · video for this lesson</p>
      <label class="field" for="video-url-${id}">YouTube link
        <input type="url" id="video-url-${id}" data-vid="${id}" data-field="url" value="${esc(v.url || "")}" placeholder="https://www.youtube.com/watch?v=…">
      </label>
      ${bad ? `<p class="warn">This doesn’t look like a YouTube link. It will still work as a link if it starts with https://.</p>` : ""}
      <label class="field" for="video-title-${id}">Title students see
        <input type="text" id="video-title-${id}" data-vid="${id}" data-field="title" value="${esc(v.title || "")}" placeholder="e.g. Solving two-step equations">
      </label>
      <label class="check"><input type="checkbox" id="video-live-${id}" data-vid="${id}" data-field="live" ${v.live ? "checked" : ""} ${v.url ? "" : "disabled"}> Show this video to students</label>
      ${v.suggested && !v.live ? `<p class="warn">Suggested by Claude. Watch it first, then tick the box if it fits your lesson, or paste a different link.</p>` : ""}
    </section>`;
}

function practiceList(id) {
  return `<ol class="practice">${(PRACTICE[id] || []).map(p => `
    <li><p>${esc(p.q)}</p><details><summary>Show answer</summary><p>${esc(p.a)}</p></details></li>`).join("")}</ol>`;
}

function lessonBlock(u, day) {
  const id = dayId(u, day);
  const v = S().videos[id];
  const showVideo = v && v.url && (v.live || teacher.on);
  const res = day.resources.filter(r => shows(resHidden(u, day, r)));
  // "Video and practice only" mode drops the objectives and the notes/homework/exit ticket links.
  const full = !S().videoPracticeOnly;
  return `
    ${day.extension ? `<p class="note">This is an optional challenge lesson. Your teacher may assign it if the class is ready.</p>` : ""}
    ${full ? `
    <section class="panel">
      <p class="label">Today’s objective</p>
      <p class="objective">${esc(day.objective)}</p>
    </section>` : ""}
    ${showVideo ? videoCard(v, !v.live) : ""}
    ${teacher.on ? videoEditor(u, day) : ""}
    ${PRACTICE[id] ? `
    <section class="week">
      <p class="label">Practice · try these, then check your answer</p>
      ${practiceList(id)}
    </section>` : ""}
    ${full && day.language ? `
    <section class="panel">
      <p class="label">Language objective</p>
      <p>${esc(day.language)}</p>
      ${day.vocab?.length ? `<div class="vocab" aria-label="Key vocabulary">${day.vocab.map(v => `<span>${esc(v)}</span>`).join("")}</div>` : ""}
    </section>` : ""}
    ${full && res.length ? `
    <section class="week">
      <p class="label">Today’s materials</p>
      <div class="resources">
        ${res.map(r => {
          const hid = resHidden(u, day, r);
          return `<div class="row ${hid ? "is-hidden" : ""}">
          <a class="res" href="${esc(r.url)}" target="_blank" rel="noopener">
            <span class="kind">${esc(r.kind)}</span><span class="name">${esc(r.name)}</span><span class="go">${hid ? "Hidden" : "Open ↗"}</span>
          </a>${eye(`${id}:${r.kind}`, !!draft.hidden[`${id}:${r.kind}`], r.kind)}</div>`;
        }).join("")}
      </div>
    </section>` : ""}`;
}

// Prev/next skip anything students can't see.
function neighbor(u, day, step) {
  const all = UNITS.flatMap(x => x.days.map(d => [x, d])).filter(([x, d]) => (x === u && d === day) || shows(dayHidden(x, d)));
  const i = all.findIndex(([x, d]) => x === u && d === day);
  return all[i + step];
}

function pagerLink([u, d], cls, arrowLeft, currentUnit) {
  const where = u === currentUnit ? d.label : `Unit ${u.label} · ${d.label}`;
  return `<a class="${cls}" href="#${dayId(u, d)}"><small>${arrowLeft ? "← " + esc(where) : esc(where) + " →"}</small>${esc(d.topic)}</a>`;
}

function renderDay(u, day) {
  crumbs.innerHTML = `<a href="#home">Home</a><span>/</span><a href="#${u.id}">Unit ${esc(u.label)}</a><span>/</span><span>${esc(day.label)}</span>`;
  document.title = `Unit ${u.label} ${day.label}: ${day.topic}`;
  const prev = neighbor(u, day, -1), next = neighbor(u, day, 1);
  app.innerHTML = `
    <section class="hero ${dayHidden(u, day) ? "is-hidden" : ""}">
      <p class="eyebrow">Unit ${esc(u.label)} · ${esc(day.label)}</p>
      <h1>${esc(day.topic)}</h1>
    </section>
    ${teacher.on ? `<section class="tpanel"><div class="row" style="align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><span>${unitHidden(u) ? `Unit ${esc(u.label)} is hidden, so students can’t see this day.` : dayHidden(u, day) ? "Students can’t see this day." : "Students can see this day."}</span>${eye(dayId(u, day), !!draft.hidden[dayId(u, day)], "this day")}</div></section>` : ""}
    ${day.event ? eventBlock(u, day) : lessonBlock(u, day)}
    <nav class="pager" aria-label="Other days">
      ${prev ? pagerLink(prev, "", true, u) : `<span></span>`}
      ${next ? pagerLink(next, "next", false, u) : `<span></span>`}
    </nav>`;
}

function renderGone() {
  crumbs.innerHTML = `<a href="#home">Home</a>`;
  app.innerHTML = `<section class="gone"><h2>This page isn’t open yet</h2><p class="note" style="margin-top:.5rem">Your teacher hasn’t opened this part of the site. <a href="#home">Go to the class lessons</a>.</p></section>`;
}

function route(scroll = true) {
  const h = current.replace("#", "");
  let done = false;
  for (const u of UNITS) {
    if (h === u.id) { unitShown(u) ? renderUnit(u) : renderGone(); done = true; break; }
    const day = u.days.find(d => h === dayId(u, d));
    if (day) { shows(dayHidden(u, day)) ? renderDay(u, day) : renderGone(); done = true; break; }
  }
  if (!done) renderHome();
  renderBar();
  if (scroll) window.scrollTo(0, 0);
}

// ---- Teacher bar and saving ----
let bar = null;
function renderBar() {
  if (!teacher.allowed) return;
  if (!bar) { bar = document.createElement("div"); bar.className = "tbar"; document.body.appendChild(bar); document.body.classList.add("has-tbar"); }
  const n = dirty();
  bar.innerHTML = `<div class="tbar-in">
    <span class="msg" role="status">${teacher.error ? esc(teacher.error) : teacher.saving ? "Saving…" : teacher.on ? (n ? "You have unsaved changes. Students see them after you save." : "Teacher view: hidden parts are dimmed.") : "You’re seeing what students see."}</span>
    ${teacher.on && n ? `<button type="button" id="tb-discard" ${teacher.saving ? "disabled" : ""}>Discard</button><button type="button" class="primary" id="tb-save" ${teacher.saving ? "disabled" : ""}>Save for students</button>` : ""}
    <button type="button" id="tb-toggle" aria-pressed="${teacher.on}">${teacher.on ? "Preview as student" : "Teacher view"}</button>
  </div>`;
}

function pageHtml(settings) {
  const json = JSON.stringify(settings).replace(/</g, "\\u003c");
  const code = document.getElementById("app-code").textContent;
  return SKELETON + SHELL + `<script type="application/json" id="settings">${json}<\/script>\n<script id="app-code">${code}<\/script>\n</body></html>`;
}

async function save() {
  if (!teacher.artifact || !dirty()) return;
  teacher.saving = true; teacher.error = ""; renderBar();
  ss.set("teacherOn", "1"); ss.set("hash", current); ss.set("draft", null);
  try {
    await teacher.artifact.publish(pageHtml(draft));   // every open view reloads to the new version
  } catch (e) {
    teacher.saving = false;
    const code = e && e.code;
    if (code === "conflict") teacher.error = "A newer version was saved somewhere else. Reloading it now.";
    else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled") {
      teacher.error = "You can’t save changes from this view."; teacher.allowed = true;
    } else if (code === "rate_limited") teacher.error = "Saving too often. Wait a minute, then save again.";
    else teacher.error = "Saving didn’t work. Check your connection and save again.";
    ss.set("draft", JSON.stringify(draft));
    renderBar();
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("eye")) { setHidden(b.dataset.key, b.getAttribute("aria-pressed") !== "true"); return; }
  if (b.id === "tb-toggle") { teacher.on = !teacher.on; teacher.error = ""; ss.set("teacherOn", teacher.on ? "1" : null); route(false); }
  if (b.id === "tb-discard") { draft = structuredClone(saved); ss.set("draft", null); route(false); }
  if (b.id === "tb-save") save();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "opt-video-only") { draft.videoPracticeOnly = t.checked; ss.set("draft", JSON.stringify(draft)); route(false); return; }
  if (t.id === "opt-replace-notes") { draft.videoReplacesNotes = t.checked; ss.set("draft", JSON.stringify(draft)); route(false); return; }
  if (!t.dataset.vid) return;
  const id = t.dataset.vid, v = { ...(draft.videos[id] || {}) };
  if (t.dataset.field === "live") v.live = t.checked;
  else v[t.dataset.field] = t.value.trim();
  if (t.dataset.field === "url") delete v.suggested;
  if (!v.url) { delete draft.videos[id]; } else draft.videos[id] = v;
  ss.set("draft", JSON.stringify(draft));
  route(false);
});

// Navigation is handled in the page instead of by the browser, so the site also works inside
// embeds (like Google Sites) that block link-based page changes.
let current = location.hash;
function go(hash) {
  current = hash;
  try { history.pushState(null, "", hash); } catch {}
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  go(a.getAttribute("href"));
});
window.addEventListener("popstate", () => { current = location.hash; route(); });
window.addEventListener("hashchange", () => { if (location.hash !== current) { current = location.hash; route(); } });
// ---- Google Sheet control panel ----
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function sheetRecords(text) {
  if (!text || text.trimStart().startsWith("<")) throw new Error("not csv");   // a sign-in page, not data
  const [head, ...rows] = parseCSV(text);
  const key = head.map(h => h.trim().toLowerCase());
  return rows.map(r => Object.fromEntries(key.map((k, i) => [k, (r[i] || "").trim()])));
}

async function loadSheet() {
  const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=`;
  const get = name => fetch(`${base}${encodeURIComponent(name)}&t=${Date.now()}`).then(r => r.ok ? r.text() : Promise.reject(r.status));
  const timeout = new Promise((_, no) => setTimeout(() => no("timeout"), 6000));
  const [settingsCsv, practiceCsv] = await Promise.race([Promise.all([get("Settings"), get("Practice").catch(() => null)]), timeout]);
  const known = new Set(UNITS.flatMap(u => [u.id, ...u.days.map(d => dayId(u, d))]));
  const next = { hidden: {}, videos: {}, videoReplacesNotes: false };
  let matched = 0;
  for (const r of sheetRecords(settingsCsv)) {
    if (!known.has(r.id)) continue;
    matched++;
    if (r["show to students"].toUpperCase() === "FALSE") next.hidden[r.id] = true;
    if (r["show notes"].toUpperCase() === "FALSE") next.hidden[r.id + ":Notes"] = true;
    if (/^https?:\/\//.test(r["video link"])) next.videos[r.id] = { url: r["video link"], title: r["video title"], live: true };
  }
  if (!matched) throw new Error("no matching rows");
  saved = next; draft = structuredClone(next);
  if (practiceCsv) {
    const p = {};
    for (const r of sheetRecords(practiceCsv)) if (known.has(r.id) && r.question) (p[r.id] ||= []).push({ q: r.question, a: r.answer });
    PRACTICE = p;
  }
}

if (SHEET_ID) {
  app.innerHTML = `<p class="note">Loading lessons…</p>`;
  loadSheet().catch(() => {}).finally(() => route(false));   // on failure, use the settings built into the page
} else route();

(async () => {
  if (SHEET_ID) return;   // the sheet is the control panel, so the in-page teacher view is off
  const user = await window.claude?.use?.("user");
  if (!(await user?.canEdit())) return;
  teacher.artifact = await window.claude.use("artifact");
  if (!teacher.artifact) return;
  teacher.allowed = true;
  if (ss.get("teacherOn")) {
    teacher.on = true;
    const d = ss.get("draft"); if (d) try { draft = JSON.parse(d); } catch {}
    const h = ss.get("hash"); ss.set("hash", null);
    if (h && h !== current) { go(h); return; }
  }
  route(false);
})();
</script>
</body></html>
