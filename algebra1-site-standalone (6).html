<style>
/* Layout: graph-paper ground, one centered reading column; breadcrumb > big title > content blocks; day pages end with prev/next. */
:root {
  --paper: #f7f9fc;
  --grid: #e3e9f3;
  --surface: #ffffff;
  --ink: #16213a;
  --muted: #5a6680;
  --line: #d5ddea;
  --accent: #2547c9;
  --accent-soft: #e6ecfd;
  --marker: #ffd84d;
  --marker-ink: #3b2f00;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1524; --grid: #18213a; --surface: #161e33; --ink: #e7ecf7; --muted: #9aa6c2;
    --line: #2a3654; --accent: #8ea6ff; --accent-soft: #1f2b52; --marker: #e8c33a; --marker-ink: #2a2100;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1524; --grid: #18213a; --surface: #161e33; --ink: #e7ecf7; --muted: #9aa6c2;
  --line: #2a3654; --accent: #8ea6ff; --accent-soft: #1f2b52; --marker: #e8c33a; --marker-ink: #2a2100;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.55;
}
.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.5rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.375rem; font-weight: 700; }
p { margin: 0; }

.site-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: .5rem; }
.brand-mark { font-family: var(--font-mono); font-size: .8rem; background: var(--ink); color: var(--paper); padding: .15rem .45rem; border-radius: 4px; }
.crumbs { font-size: .9rem; color: var(--muted); display: flex; gap: .4rem; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

.eyebrow { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.hero { display: flex; flex-direction: column; gap: .6rem; }
.lede { color: var(--muted); max-width: 60ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
.label { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.objective { font-family: var(--font-display); font-size: 1.375rem; font-weight: 700; line-height: 1.25; }
.vocab { display: flex; flex-wrap: wrap; gap: .4rem; }
.vocab span { font-family: var(--font-mono); font-size: .85rem; background: var(--accent-soft); color: var(--ink); padding: .2rem .55rem; border-radius: 4px; }

.resources { display: grid; gap: .6rem; }
.res {
  display: grid; grid-template-columns: 7.5rem 1fr auto; gap: .75rem; align-items: center;
  padding: .85rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--ink); text-decoration: none;
}
.res .kind { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.res .name { min-width: 0; }
.res .go { font-size: .85rem; color: var(--muted); white-space: nowrap; }
a.res:hover { border-color: var(--accent); }
a.res:hover .go { color: var(--accent); }
.res.pending { opacity: .75; }
@media (max-width: 520px) {
  .res { grid-template-columns: 1fr auto; }
  .res .kind { grid-column: 1 / -1; }
}

.event { background: var(--marker); color: var(--marker-ink); border-radius: 10px; padding: 1.25rem; display: flex; flex-direction: column; gap: .4rem; }
.event h2 { color: var(--marker-ink); }

.week { display: flex; flex-direction: column; gap: .6rem; }
.days { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.days li + li { border-top: 1px solid var(--line); }
.days a { display: grid; grid-template-columns: 4.25rem 1fr auto; gap: .75rem; align-items: center; padding: .8rem 1rem; color: var(--ink); text-decoration: none; }
.days a:hover { background: var(--accent-soft); }
.days .num { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); }
.days .topic { min-width: 0; }
.chip { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 4px; background: var(--marker); color: var(--marker-ink); }

.units { display: grid; gap: .75rem; }
.unit-card { display: flex; flex-direction: column; gap: .35rem; padding: 1.25rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-decoration: none; }
.unit-card:hover { border-color: var(--accent); }
.unit-card .meta { font-size: .9rem; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.pager a, .pager span { display: flex; flex-direction: column; gap: .15rem; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-decoration: none; min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager .next { text-align: right; }
.pager small { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager span { visibility: hidden; }

.units { grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.unit-card { flex-direction: row; align-items: center; gap: 1rem; }
.unit-card .badge { flex: none; width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.unit-card .text { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.unit-card h2 { font-size: 1.125rem; }
.chip.ext { background: var(--accent-soft); color: var(--accent); }
.covers { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
.covers a { color: var(--marker-ink); font-weight: 700; }
.covers span { font-family: var(--font-mono); font-size: .8rem; margin-right: .5rem; }
.note { font-size: .95rem; color: var(--muted); }
.foot { font-size: .85rem; color: var(--muted); }

/* Video card */
.video { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; padding: 1rem 1.1rem; border-radius: 10px; background: var(--ink); color: var(--paper); text-decoration: none; }
.video .play { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: var(--marker); color: var(--marker-ink); display: grid; place-items: center; font-size: 1.1rem; }
.video .vt { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.video .vt small { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.video .go { font-size: .85rem; opacity: .8; white-space: nowrap; }
.video:hover .go { opacity: 1; }
.covers { gap: .5rem; }
.covers { gap: .65rem; }
.covers li { display: grid; grid-template-columns: 3.5rem 1fr; align-items: baseline; gap: .2rem 0; }
.covers li > :not(span) { grid-column: 2; justify-self: start; }
.covers .vid { font-family: var(--font-mono); font-size: .75rem; font-weight: 500; text-decoration: none; background: var(--ink); color: var(--paper); padding: .15rem .5rem; border-radius: 4px; }
.covers .vid:hover { text-decoration: underline; }

/* Teacher controls */
.row { display: flex; align-items: stretch; }
.row > a { flex: 1; min-width: 0; }
.eye { flex: none; font: 600 .78rem var(--font-mono); letter-spacing: .04em; padding: .35rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; align-self: center; margin: 0 .6rem; }
.eye[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.is-hidden { opacity: .5; }
.is-hidden .topic::after, .is-hidden h2::after { content: " · hidden"; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.units .row { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.units .row .unit-card { border: 0; background: none; }
.resources .row { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.resources .row .res { border: 0; background: none; }
.tpanel { border: 1px dashed var(--accent); border-radius: 10px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; background: var(--surface); }
.tpanel .label { color: var(--accent); }
.field { display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; }
.field input[type="url"], .field input[type="text"] { font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); width: 100%; }
.check { display: flex; gap: .5rem; align-items: center; font-size: .95rem; }
.warn { font-size: .85rem; color: var(--muted); }
.tbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: .6rem calc(.6rem + env(safe-area-inset-bottom, 0px)); }
.tbar-in { max-width: 46rem; margin: 0 auto; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.tbar-in .msg { flex: 1; min-width: 10rem; }
.tbar button { font: 700 .85rem var(--font-body); padding: .45rem .8rem; border-radius: 6px; border: 1px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer; }
.tbar button.primary { background: var(--marker); color: var(--marker-ink); border-color: var(--marker); }
.tbar button:disabled { opacity: .5; cursor: default; }
body.has-tbar .wrap { padding-bottom: 6rem; }
/* Practice */
.practice { margin: 0; padding-left: 1.6rem; display: grid; gap: .75rem; }
.practice li { padding-left: .25rem; }
.practice li::marker { font-family: var(--font-mono); color: var(--muted); }
.practice details { margin-top: .3rem; }
.practice summary { cursor: pointer; font-size: .9rem; color: var(--accent); font-weight: 700; width: fit-content; }
.practice details p { margin-top: .35rem; padding: .6rem .8rem; border-radius: 6px; background: var(--accent-soft); }
.pset { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: .8rem 1rem; }
.pset > summary { cursor: pointer; font-weight: 700; display: flex; gap: .6rem; align-items: baseline; }
.pset > summary span { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); font-weight: 500; flex: none; width: 3.5rem; }
.pset[open] > summary { margin-bottom: .8rem; }
.lcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
.lhead { display: flex; gap: .6rem; align-items: baseline; }
.lhead span { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); flex: none; width: 3.5rem; }
.lhead h3 { font-size: 1.05rem; }
.lhead h3 a { color: var(--ink); }
.lcard .vid { align-self: flex-start; display: inline-flex; flex-wrap: wrap; gap: .25rem; font: 700 .85rem var(--font-body); text-decoration: none; background: var(--ink); color: var(--paper); padding: .45rem .75rem; border-radius: 6px; max-width: 100%; }
.lcard .vid span { font-weight: 400; opacity: .8; }
.lcard .vid:hover { text-decoration: underline; }
.pq > summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: .92rem; width: fit-content; }
.pq[open] > summary { margin-bottom: .6rem; }
.gone { padding: 1.25rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

const PRACTICE = {"u2d1": [{"q": "Solve: x + 9 = 23", "a": "Subtract 9 from both sides: x = 14"}, {"q": "Solve: y − 6 = −11", "a": "Add 6 to both sides: y = −5"}, {"q": "Solve: −4m = 36", "a": "Divide both sides by −4: m = −9"}, {"q": "Solve: n ÷ 5 = −3", "a": "Multiply both sides by 5: n = −15"}, {"q": "Solve: 7 + k = 2. Which inverse operation did you use, and why?", "a": "Subtract 7 from both sides, because subtraction undoes adding 7 and isolates k. k = −5"}], "u2d2": [{"q": "Solve: 3x + 5 = 20", "a": "Subtract 5: 3x = 15. Divide by 3: x = 5"}, {"q": "Solve: −2y − 7 = 9", "a": "Add 7: −2y = 16. Divide by −2: y = −8"}, {"q": "Solve: x/4 + 6 = 1", "a": "Subtract 6: x/4 = −5. Multiply by 4: x = −20"}, {"q": "Solve: 10 = 5 − m", "a": "Subtract 5: 5 = −m. Divide by −1: m = −5"}, {"q": "Jada solved 2x + 8 = 14 by dividing by 2 first and got x + 8 = 7, so x = −1. What went wrong?", "a": "She divided only the 2x by 2, not the 8. Undo the addition first: 2x = 6, so x = 3. Check: 2(3) + 8 = 14 ✓"}], "u2d3": [{"q": "A gym charges $25 to join plus $15 per month. Maria paid $115 in total. Write and solve an equation to find how many months she paid for.", "a": "25 + 15m = 115. Subtract 25: 15m = 90. Divide by 15: m = 6 months"}, {"q": "Devon bought 4 movie tickets and a $6 popcorn. He spent $50. How much was each ticket?", "a": "4t + 6 = 50. Subtract 6: 4t = 44. Divide by 4: t = $11"}, {"q": "The temperature was −3°F in the morning and 12°F in the afternoon. By how many degrees did it rise?", "a": "−3 + r = 12. Add 3: r = 15 degrees"}, {"q": "A phone plan costs $40 per month. Sam has paid $280 so far. How many months has he had the plan?", "a": "40m = 280. Divide by 40: m = 7 months"}, {"q": "Sofia has $18 and saves $6 each week. How many weeks until she has $60?", "a": "18 + 6w = 60. Subtract 18: 6w = 42. Divide by 6: w = 7 weeks"}], "u2d4": [{"q": "Solve: 3(x + 4) = 27", "a": "Distribute: 3x + 12 = 27. Subtract 12: 3x = 15. x = 5"}, {"q": "Solve: 6x − 2x + 3 = 31", "a": "Combine like terms: 4x + 3 = 31. Subtract 3: 4x = 28. x = 7"}, {"q": "Solve: −2(3y − 1) = 26", "a": "Distribute: −6y + 2 = 26. Subtract 2: −6y = 24. y = −4"}, {"q": "Solve: 4(m − 2) + 3m = 20", "a": "Distribute: 4m − 8 + 3m = 20. Combine like terms: 7m − 8 = 20. Add 8: 7m = 28. m = 4"}, {"q": "Solve: 5(n + 1) − 2n = 17", "a": "Distribute: 5n + 5 − 2n = 17. Combine like terms: 3n + 5 = 17. Subtract 5: 3n = 12. n = 4"}], "u2d5": [{"q": "Solve: x/6 = 10/15", "a": "Cross multiply: 15x = 60. x = 4"}, {"q": "Solve: 3/8 = 12/y", "a": "Cross multiply: 3y = 96. y = 32"}, {"q": "Solve: (x + 2)/5 = 6/10", "a": "Cross multiply: 10(x + 2) = 30. Divide by 10: x + 2 = 3. x = 1"}, {"q": "Solve: 4/(m − 1) = 2/3", "a": "Cross multiply: 12 = 2(m − 1). Divide by 2: 6 = m − 1. m = 7"}, {"q": "Do 4/10 and 6/15 form a proportion? Explain how you know.", "a": "Yes. Cross products are equal: 4 × 15 = 60 and 10 × 6 = 60, so the two ratios are equal"}], "u2d6": [{"q": "3 cups of flour make 24 cookies. How many cups do you need for 40 cookies?", "a": "3/24 = c/40. Cross multiply: 24c = 120. c = 5 cups"}, {"q": "On a map, 1 inch = 25 miles. Two towns are 3.5 inches apart on the map. How far apart are they really?", "a": "1/25 = 3.5/d. Cross multiply: d = 87.5 miles"}, {"q": "A car goes 150 miles on 6 gallons of gas. How far can it go on 10 gallons?", "a": "150/6 = d/10. Cross multiply: 6d = 1500. d = 250 miles"}, {"q": "A 6-foot person casts a 4-foot shadow. At the same time, a tree casts an 18-foot shadow. How tall is the tree?", "a": "6/4 = h/18. Cross multiply: 4h = 108. h = 27 feet"}, {"q": "5 notebooks cost $8. How much do 15 notebooks cost?", "a": "5/8 = 15/c. Cross multiply: 5c = 120. c = $24"}], "u2d7": [{"q": "Solve: 5x + 3 = 2x + 18", "a": "Subtract 2x: 3x + 3 = 18. Subtract 3: 3x = 15. x = 5"}, {"q": "Solve: 7y − 4 = 3y + 12", "a": "Subtract 3y: 4y − 4 = 12. Add 4: 4y = 16. y = 4"}, {"q": "Solve: 2(m + 3) = 5m − 9", "a": "Distribute: 2m + 6 = 5m − 9. Subtract 2m: 6 = 3m − 9. Add 9: 15 = 3m. m = 5"}, {"q": "Solve: −3n + 8 = n − 4", "a": "Add 3n: 8 = 4n − 4. Add 4: 12 = 4n. n = 3"}, {"q": "Solve: 6 − 2x = 4x − 18", "a": "Add 2x: 6 = 6x − 18. Add 18: 24 = 6x. x = 4"}], "u2d9": [{"q": "How many solutions? 3(x + 2) = 3x + 6", "a": "Distribute: 3x + 6 = 3x + 6. Subtract 3x: 6 = 6, which is always true. Infinitely many solutions"}, {"q": "How many solutions? 4x − 5 = 4x + 1", "a": "Subtract 4x: −5 = 1, which is never true. No solution"}, {"q": "How many solutions? 2(x − 3) = 2x − 4", "a": "Distribute: 2x − 6 = 2x − 4. Subtract 2x: −6 = −4, which is never true. No solution"}, {"q": "How many solutions? 5x + 2 = 3x + 2", "a": "Subtract 3x: 2x + 2 = 2. Subtract 2: 2x = 0. x = 0, so there is one solution. Watch out: x = 0 is a real answer, not “no solution”"}, {"q": "Fill in the blank so that 6x + 4 = 6x + ___ has (a) no solution, (b) infinitely many solutions.", "a": "(a) Any number except 4, such as 6x + 4 = 6x + 9. (b) 4, so both sides are exactly the same"}], "u2d10": [{"q": "Solve: |x| = 9", "a": "x = 9 or x = −9"}, {"q": "Solve: |x − 3| = 5", "a": "x − 3 = 5 gives x = 8. x − 3 = −5 gives x = −2"}, {"q": "Solve: |2x + 1| = 7", "a": "2x + 1 = 7 gives x = 3. 2x + 1 = −7 gives x = −4"}, {"q": "Solve: |x| + 4 = 10", "a": "Isolate the absolute value first: |x| = 6. x = 6 or x = −6"}, {"q": "Solve: 3|x − 1| = 12", "a": "Divide by 3: |x − 1| = 4. x − 1 = 4 gives x = 5. x − 1 = −4 gives x = −3"}, {"q": "Solve: |x + 2| = −3", "a": "No solution. Absolute value measures distance from zero, and a distance can’t be negative"}], "u2d11": [{"q": "Solve P = 4s for s.", "a": "Divide both sides by 4: s = P/4"}, {"q": "Solve A = lw for w.", "a": "Divide both sides by l: w = A/l"}, {"q": "Solve d = rt for t.", "a": "Divide both sides by r: t = d/r"}, {"q": "Solve y = mx + b for b.", "a": "Subtract mx from both sides: b = y − mx"}, {"q": "Solve P = 2l + 2w for l.", "a": "Subtract 2w: P − 2w = 2l. Divide by 2: l = (P − 2w)/2"}], "u2d12": [{"q": "Solve 3x + 2y = 12 for y.", "a": "Subtract 3x: 2y = 12 − 3x. Divide by 2: y = (12 − 3x)/2"}, {"q": "Solve A = ½bh for h.", "a": "Multiply both sides by 2: 2A = bh. Divide by b: h = 2A/b"}, {"q": "Solve y = mx + b for x.", "a": "Subtract b: y − b = mx. Divide by m: x = (y − b)/m"}, {"q": "Solve ax + b = c for x.", "a": "Subtract b: ax = c − b. Divide by a: x = (c − b)/a"}, {"q": "Solve V = πr²h for h.", "a": "Divide both sides by πr²: h = V/(πr²)"}, {"q": "Solve C = 5/9(F − 32) for F.", "a": "Multiply both sides by 9/5: 9C/5 = F − 32. Add 32: F = 9C/5 + 32"}], "u2d13": [{"q": "A price goes from $40 to $50. Find the percent change. Is it an increase or a decrease?", "a": "(50 − 40) ÷ 40 = 0.25, so a 25% increase"}, {"q": "A price goes from $80 to $60. Find the percent change.", "a": "(60 − 80) ÷ 80 = −0.25, so a 25% decrease"}, {"q": "Shoes that cost $75 are on sale for $60. What is the percent change?", "a": "(60 − 75) ÷ 75 = −0.20, so a 20% decrease"}, {"q": "A class grows from 25 students to 30 students. What is the percent change?", "a": "(30 − 25) ÷ 25 = 0.20, so a 20% increase"}, {"q": "A phone’s price rises from $200 to $230. What is the percent change?", "a": "(230 − 200) ÷ 200 = 0.15, so a 15% increase"}, {"q": "A town’s population changed by −10%. What does the negative sign tell you?", "a": "The population decreased. A negative percent change means the new amount is less than the original amount"}]};

rem; border-radius: 50%; background: var(--marker); color: var(--marker-ink); display: grid; place-items: center; font-size: 1.1rem; }\n.video .vt { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }\n.video .vt small { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }\n.video .go { font-size: .85rem; opacity: .8; white-space: nowrap; }\n.video:hover .go { opacity: 1; }\n.covers { gap: .5rem; }\n.covers { gap: .65rem; }\n.covers li { display: grid; grid-template-columns: 3.5rem 1fr; align-items: baseline; gap: .2rem 0; }\n.covers li > :not(span) { grid-column: 2; justify-self: start; }\n.covers .vid { font-family: var(--font-mono); font-size: .75rem; font-weight: 500; text-decoration: none; background: var(--ink); color: var(--paper); padding: .15rem .5rem; border-radius: 4px; }\n.covers .vid:hover { text-decoration: underline; }\n\n/* Teacher controls */\n.row { display: flex; align-items: stretch; }\n.row > a { flex: 1; min-width: 0; }\n.eye { flex: none; font: 600 .78rem var(--font-mono); letter-spacing: .04em; padding: .35rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; align-self: center; margin: 0 .6rem; }\n.eye[aria-pressed=\"true\"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n.is-hidden { opacity: .5; }\n.is-hidden .topic::after, .is-hidden h2::after { content: \" · hidden\"; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }\n.units .row { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }\n.units .row .unit-card { border: 0; background: none; }\n.resources .row { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }\n.resources .row .res { border: 0; background: none; }\n.tpanel { border: 1px dashed var(--accent); border-radius: 10px; padding: 1rem 1.1rem; display: flex; flex-direction: col const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';

const SUMMARY = {
  ua: "Rational numbers, percents, fractions, order of operations, ratios and rates, and an introduction to data and probability.",
  u1: "Translating, evaluating and simplifying expressions, multiplying binomials, and area and perimeter.",
  u2: "One-step, two-step and multi-step equations, proportions, absolute value, literal equations and percent change.",
  u3: "Solving one-step, multi-step and compound inequalities and writing inequalities from word problems.",
  u4: "Domain and range, function rules, linear and nonlinear patterns, and function notation.",
  ub: "Box plots, data displays, central tendency, probability, counting, and unit and rate conversions.",
  u5: "Intercepts, slope, slope-intercept form, writing equations of lines, scatterplots and graphing.",
  u6: "Solving systems by graphing, substitution and elimination, and systems of linear inequalities.",
  u7: "Exponent rules, adding and subtracting polynomials, and factoring.",
  u8: "Graphing quadratics, solving by square roots, factoring, completing the square and the quadratic formula."
};

// Settings: what is hidden from students and which lessons have a video. Saved inside the page.
function readSettings() {
  try {
    const s = JSON.parse(document.getElementById("settings").textContent);
    return { hidden: s.hidden || {}, videos: s.videos || {}, videoReplacesNotes: !!s.videoReplacesNotes };
  } catch { return { hidden: {}, videos: {}, videoReplacesNotes: false }; }
}
const saved = readSettings();
let draft = structuredClone(saved);
let teacher = { allowed: false, on: false, saving: false, artifact: null, error: "" };

const ss = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }
};

const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dayId = (u, day) => `${u.id}d${day.d}`;
const isLesson = day => !day.event && !day.extension;
const S = () => teacher.on ? draft : saved;   // teacher view previews unsaved changes

const unitHidden = u => !!S().hidden[u.id];
const dayHidden = (u, day) => unitHidden(u) || !!S().hidden[dayId(u, day)];
const liveVideo = (u, day) => { const v = S().videos[dayId(u, day)]; return v && v.url && v.live ? v : null; };
const resHidden = (u, day, r) => !!S().hidden[`${dayId(u, day)}:${r.kind}`] ||
  (S().videoReplacesNotes && r.kind === "Notes" && !!liveVideo(u, day));
// Students never see hidden things; the teacher sees them dimmed.
const shows = hidden => teacher.on || !hidden;

const dirty = () => JSON.stringify(draft) !== JSON.stringify(saved);
function setHidden(key, value) {
  if (value) draft.hidden[key] = true; else delete draft.hidden[key];
  ss.set("draft", JSON.stringify(draft));
  route(false);
}
const eye = (key, hidden, what) => teacher.on
  ? `<button type="button" class="eye" data-key="${esc(key)}" aria-pressed="${hidden}" aria-label="${hidden ? "Show" : "Hide"} ${esc(what)} for students">${hidden ? "Hidden" : "Visible"}</button>`
  : "";

function coveredBy(u, day) {
  const i = u.days.indexOf(day);
  if (day.event === "quiz") {
    const out = [];
    for (let j = i - 1; j >= 0 && u.days[j].event !== "quiz"; j--) if (isLesson(u.days[j])) out.unshift(u.days[j]);
    return out;
  }
  return u.days.slice(0, i).filter(isLesson);
}

function renderHome() {
  crumbs.innerHTML = "";
  document.title = "Algebra 1 Class Site";
  const units = UNITS.filter(u => shows(unitHidden(u)));
  app.innerHTML = `
    <section class="hero">
      <p class="eyebrow">Algebra 1</p>
      <h1>Class lessons</h1>
      <p class="lede">Pick a unit, then a day, to find that day’s objective, video, notes, homework and exit ticket.</p>
    </section>
    ${teacher.on ? `
    <section class="tpanel">
      <p class="label">Teacher settings</p>
      <label class="check"><input type="checkbox" id="opt-replace-notes" ${draft.videoReplacesNotes ? "checked" : ""}> When a lesson has a video that students can see, hide its notes</label>
    </section>` : ""}
    <section class="units">
      ${units.map(u => `
        <div class="row ${unitHidden(u) ? "is-hidden" : ""}">
          <a class="unit-card" href="#${u.id}">
            <span class="badge" aria-hidden="true">${esc(u.label)}</span>
            <span class="text">
              <span class="eyebrow">Unit ${esc(u.label)}</span>
              <h2>${esc(u.title)}</h2>
              <span class="meta">${u.days.filter(d => !d.extension).length} days</span>
            </span>
          </a>
          ${eye(u.id, unitHidden(u), "Unit " + u.label)}
        </div>`).join("")}
    </section>`;
}

function renderUnit(u) {
  crumbs.innerHTML = `<a href="#home">Home</a><span>/</span><span>Unit ${esc(u.label)}</span>`;
  document.title = `Unit ${u.label}: ${u.title}`;
  const groups = [];
  for (const day of u.days) {
    if (!shows(!!S().hidden[dayId(u, day)])) continue;
    const key = day.extension ? "ext" : day.week;
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, days: [] });
    g.days.push(day);
  }
  app.innerHTML = `
    <section class="hero ${unitHidden(u) ? "is-hidden" : ""}">
      <p class="eyebrow">Unit ${esc(u.label)}</p>
      <h1>${esc(u.title)}</h1>
      <p class="lede">${esc(SUMMARY[u.id] || "")}</p>
    </section>
    ${teacher.on ? `<section class="tpanel"><p class="label">Teacher</p><div class="row" style="align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><span>${unitHidden(u) ? "Students can’t see this unit." : "Students can see this unit."} Hide single days with the buttons below.</span>${eye(u.id, unitHidden(u), "this unit")}</div></section>` : ""}
    ${groups.map(g => `
      <section class="week">
        <p class="label">${g.key === "ext" ? "Extension lessons (optional)" : `Week ${g.key}`}</p>
        <ol class="days">
          ${g.days.map(day => {
            const hid = !!S().hidden[dayId(u, day)];
            return `
            <li class="row ${hid ? "is-hidden" : ""}"><a href="#${dayId(u, day)}">
              <span class="num">${day.extension ? "Ext. " + day.label.split(" ")[1] : esc(day.label)}</span>
              <span class="topic">${esc(day.topic)}</span>
              ${day.event ? `<span class="chip">${day.event}</span>` : day.extension ? `<span class="chip ext">extension</span>` : liveVideo(u, day) ? `<span class="chip ext">video</span>` : ""}
            </a>${eye(dayId(u, day), hid, day.label)}</li>`;
          }).join("")}
        </ol>
      </section>`).join("")}`;
}

function videoCard(v, draftNote) {
  return `
    <a class="video" href="${esc(v.url)}" target="_blank" rel="noopener">
      <span class="play" aria-hidden="true">▶</span>
      <span class="vt"><small>Video lesson${draftNote ? " · not visible to students yet" : ""}</small><span>${esc(v.title || "Watch the video")}</span></span>
      <span class="go">YouTube ↗</span>
    </a>`;
}

function eventBlock(u, day) {
  // Quiz, review and test pages list every lesson they cover, even hidden ones, so the videos stay reachable.
  const covered = coveredBy(u, day);
  const intro = {
    quiz: covered.length ? `Today is a quiz on Days ${covered[0].d}–${covered[covered.length - 1].d}. Go back over the videos and practice for these lessons below.` : "Today is a quiz.",
    review: `Today we review everything from Unit ${u.label} to get ready for the test. For each lesson below, rewatch the video and try the practice questions. Bring your notes, homework and exit tickets, and come with questions.`,
    test: `Today is the Unit ${u.label} test. Bring a pencil and a calculator. The test covers the lessons below.`
  }[day.event];
  const label = { quiz: "Quiz day", review: "Review", test: "Test day" }[day.event];
  const lessonCard = c => {
    const v = liveVideo(u, c), id = dayId(u, c), n = (PRACTICE[id] || []).length;
    const topic = shows(dayHidden(u, c)) ? `<a href="#${id}">${esc(c.topic)}</a>` : esc(c.topic);
    return `
      <section class="lcard">
        <div class="lhead"><span>Day ${c.d}</span><h3>${topic}</h3></div>
        ${v ? `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener">▶ Watch video<span> · ${esc(v.title || "YouTube")}</span></a>` : ""}
        ${n ? `<details class="pq"><summary>Practice questions (${n})</summary>${practiceList(id)}</details>` : ""}
      </section>`;
  };
  return `
    <section class="event">
      <p class="label" style="color:inherit">${label}</p>
      <p>${esc(intro)}</p>
    </section>
    ${covered.length ? `
    <section class="week">
      <p class="label">${day.event === "test" ? "Lessons on the test" : "Lessons to review"} · watch the video, then try the practice</p>
      ${covered.map(lessonCard).join("")}
    </section>` : ""}`;
}

function videoEditor(u, day) {
  const id = dayId(u, day);
  const v = draft.videos[id] || {};
  const bad = v.url && !/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(v.url);
  return `
    <section class="tpanel">
      <p class="label">Teacher · video for this lesson</p>
      <label class="field" for="video-url-${id}">YouTube link
        <input type="url" id="video-url-${id}" data-vid="${id}" data-field="url" value="${esc(v.url || "")}" placeholder="https://www.youtube.com/watch?v=…">
      </label>
      ${bad ? `<p class="warn">This doesn’t look like a YouTube link. It will still work as a link if it starts with https://.</p>` : ""}
      <label class="field" for="video-title-${id}">Title students see
        <input type="text" id="video-title-${id}" data-vid="${id}" data-field="title" value="${esc(v.title || "")}" placeholder="e.g. Solving two-step equations">
      </label>
      <label class="check"><input type="checkbox" id="video-live-${id}" data-vid="${id}" data-field="live" ${v.live ? "checked" : ""} ${v.url ? "" : "disabled"}> Show this video to students</label>
      ${v.suggested && !v.live ? `<p class="warn">Suggested by Claude. Watch it first, then tick the box if it fits your lesson, or paste a different link.</p>` : ""}
    </section>`;
}

function practiceList(id) {
  return `<ol class="practice">${(PRACTICE[id] || []).map(p => `
    <li><p>${esc(p.q)}</p><details><summary>Show answer</summary><p>${esc(p.a)}</p></details></li>`).join("")}</ol>`;
}

function lessonBlock(u, day) {
  const id = dayId(u, day);
  const v = S().videos[id];
  const showVideo = v && v.url && (v.live || teacher.on);
  const res = day.resources.filter(r => shows(resHidden(u, day, r)));
  return `
    ${day.extension ? `<p class="note">This is an optional challenge lesson. Your teacher may assign it if the class is ready.</p>` : ""}
    <section class="panel">
      <p class="label">Today’s objective</p>
      <p class="objective">${esc(day.objective)}</p>
    </section>
    ${showVideo ? videoCard(v, !v.live) : ""}
    ${teacher.on ? videoEditor(u, day) : ""}
    ${PRACTICE[id] ? `
    <section class="week">
      <p class="label">Practice · try these, then check your answer</p>
      ${practiceList(id)}
    </section>` : ""}
    ${day.language ? `
    <section class="panel">
      <p class="label">Language objective</p>
      <p>${esc(day.language)}</p>
      ${day.vocab?.length ? `<div class="vocab" aria-label="Key vocabulary">${day.vocab.map(v => `<span>${esc(v)}</span>`).join("")}</div>` : ""}
    </section>` : ""}
    ${res.length ? `
    <section class="week">
      <p class="label">Today’s materials</p>
      <div class="resources">
        ${res.map(r => {
          const hid = resHidden(u, day, r);
          return `<div class="row ${hid ? "is-hidden" : ""}">
          <a class="res" href="${esc(r.url)}" target="_blank" rel="noopener">
            <span class="kind">${esc(r.kind)}</span><span class="name">${esc(r.name)}</span><span class="go">${hid ? "Hidden" : "Open ↗"}</span>
          </a>${eye(`${id}:${r.kind}`, !!draft.hidden[`${id}:${r.kind}`], r.kind)}</div>`;
        }).join("")}
      </div>
    </section>` : ""}`;
}

// Prev/next skip anything students can't see.
function neighbor(u, day, step) {
  const all = UNITS.flatMap(x => x.days.map(d => [x, d])).filter(([x, d]) => (x === u && d === day) || shows(dayHidden(x, d)));
  const i = all.findIndex(([x, d]) => x === u && d === day);
  return all[i + step];
}

function pagerLink([u, d], cls, arrowLeft, currentUnit) {
  const where = u === currentUnit ? d.label : `Unit ${u.label} · ${d.label}`;
  return `<a class="${cls}" href="#${dayId(u, d)}"><small>${arrowLeft ? "← " + esc(where) : esc(where) + " →"}</small>${esc(d.topic)}</a>`;
}

function renderDay(u, day) {
  crumbs.innerHTML = `<a href="#home">Home</a><span>/</span><a href="#${u.id}">Unit ${esc(u.label)}</a><span>/</span><span>${esc(day.label)}</span>`;
  document.title = `Unit ${u.label} ${day.label}: ${day.topic}`;
  const prev = neighbor(u, day, -1), next = neighbor(u, day, 1);
  app.innerHTML = `
    <section class="hero ${dayHidden(u, day) ? "is-hidden" : ""}">
      <p class="eyebrow">Unit ${esc(u.label)} · ${esc(day.label)}</p>
      <h1>${esc(day.topic)}</h1>
    </section>
    ${teacher.on ? `<section class="tpanel"><div class="row" style="align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><span>${unitHidden(u) ? `Unit ${esc(u.label)} is hidden, so students can’t see this day.` : dayHidden(u, day) ? "Students can’t see this day." : "Students can see this day."}</span>${eye(dayId(u, day), !!draft.hidden[dayId(u, day)], "this day")}</div></section>` : ""}
    ${day.event ? eventBlock(u, day) : lessonBlock(u, day)}
    <nav class="pager" aria-label="Other days">
      ${prev ? pagerLink(prev, "", true, u) : `<span></span>`}
      ${next ? pagerLink(next, "next", false, u) : `<span></span>`}
    </nav>`;
}

function renderGone() {
  crumbs.innerHTML = `<a href="#home">Home</a>`;
  app.innerHTML = `<section class="gone"><h2>This page isn’t open yet</h2><p class="note" style="margin-top:.5rem">Your teacher hasn’t opened this part of the site. <a href="#home">Go to the class lessons</a>.</p></section>`;
}

function route(scroll = true) {
  const h = current.replace("#", "");
  let done = false;
  for (const u of UNITS) {
    if (h === u.id) { shows(unitHidden(u)) ? renderUnit(u) : renderGone(); done = true; break; }
    const day = u.days.find(d => h === dayId(u, d));
    if (day) { shows(dayHidden(u, day)) ? renderDay(u, day) : renderGone(); done = true; break; }
  }
  if (!done) renderHome();
  renderBar();
  if (scroll) window.scrollTo(0, 0);
}

// ---- Teacher bar and saving ----
let bar = null;
function renderBar() {
  if (!teacher.allowed) return;
  if (!bar) { bar = document.createElement("div"); bar.className = "tbar"; document.body.appendChild(bar); document.body.classList.add("has-tbar"); }
  const n = dirty();
  bar.innerHTML = `<div class="tbar-in">
    <span class="msg" role="status">${teacher.error ? esc(teacher.error) : teacher.saving ? "Saving…" : teacher.on ? (n ? "You have unsaved changes. Students see them after you save." : "Teacher view: hidden parts are dimmed.") : "You’re seeing what students see."}</span>
    ${teacher.on && n ? `<button type="button" id="tb-discard" ${teacher.saving ? "disabled" : ""}>Discard</button><button type="button" class="primary" id="tb-save" ${teacher.saving ? "disabled" : ""}>Save for students</button>` : ""}
    <button type="button" id="tb-toggle" aria-pressed="${teacher.on}">${teacher.on ? "Preview as student" : "Teacher view"}</button>
  </div>`;
}

function pageHtml(settings) {
  const json = JSON.stringify(settings).replace(/</g, "\\u003c");
  const code = document.getElementById("app-code").textContent;
  return SKELETON + SHELL + `<script type="application/json" id="settings">${json}<\/script>\n<script id="app-code">${code}<\/script>\n</body></html>`;
}

async function save() {
  if (!teacher.artifact || !dirty()) return;
  teacher.saving = true; teacher.error = ""; renderBar();
  ss.set("teacherOn", "1"); ss.set("hash", current); ss.set("draft", null);
  try {
    await teacher.artifact.publish(pageHtml(draft));   // every open view reloads to the new version
  } catch (e) {
    teacher.saving = false;
    const code = e && e.code;
    if (code === "conflict") teacher.error = "A newer version was saved somewhere else. Reloading it now.";
    else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled") {
      teacher.error = "You can’t save changes from this view."; teacher.allowed = true;
    } else if (code === "rate_limited") teacher.error = "Saving too often. Wait a minute, then save again.";
    else teacher.error = "Saving didn’t work. Check your connection and save again.";
    ss.set("draft", JSON.stringify(draft));
    renderBar();
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("eye")) { setHidden(b.dataset.key, b.getAttribute("aria-pressed") !== "true"); return; }
  if (b.id === "tb-toggle") { teacher.on = !teacher.on; teacher.error = ""; ss.set("teacherOn", teacher.on ? "1" : null); route(false); }
  if (b.id === "tb-discard") { draft = structuredClone(saved); ss.set("draft", null); route(false); }
  if (b.id === "tb-save") save();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "opt-replace-notes") { draft.videoReplacesNotes = t.checked; ss.set("draft", JSON.stringify(draft)); route(false); return; }
  if (!t.dataset.vid) return;
  const id = t.dataset.vid, v = { ...(draft.videos[id] || {}) };
  if (t.dataset.field === "live") v.live = t.checked;
  else v[t.dataset.field] = t.value.trim();
  if (t.dataset.field === "url") delete v.suggested;
  if (!v.url) { delete draft.videos[id]; } else draft.videos[id] = v;
  ss.set("draft", JSON.stringify(draft));
  route(false);
});

// Navigation is handled in the page instead of by the browser, so the site also works inside
// embeds (like Google Sites) that block link-based page changes.
let current = location.hash;
function go(hash) {
  current = hash;
  try { history.pushState(null, "", hash); } catch {}
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  go(a.getAttribute("href"));
});
window.addEventListener("popstate", () => { current = location.hash; route(); });
window.addEventListener("hashchange", () => { if (location.hash !== current) { current = location.hash; route(); } });
route();

(async () => {
  const user = await window.claude?.use?.("user");
  if (!(await user?.canEdit())) return;
  teacher.artifact = await window.claude.use("artifact");
  if (!teacher.artifact) return;
  teacher.allowed = true;
  if (ss.get("teacherOn")) {
    teacher.on = true;
    const d = ss.get("draft"); if (d) try { draft = JSON.parse(d); } catch {}
    const h = ss.get("hash"); ss.set("hash", null);
    if (h && h !== current) { go(h); return; }
  }
  route(false);
})();
</script>
</body></html>
